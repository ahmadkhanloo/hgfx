name: PERF-01B all 64 subjects MATLAB-HGFX cohort audit (no timing)

concurrency:
  group: perf01-all-subjects-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - research/perf-01-preflight-fixtures
    paths:
      - 'benchmarks/runtime_v1/all_subjects_hgfx.py'
      - 'benchmarks/runtime_v1/matlab/all_subjects_matlab.m'
      - 'benchmarks/runtime_v1/compare_all_subjects.py'
      - '.github/workflows/perf01-all-subjects.yml'

permissions:
  contents: write

jobs:
  all-subjects:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          path: work
      - uses: actions/checkout@v4
        with:
          repository: ComputationalPsychiatry/hgf-toolbox
          ref: 2437f4dc241541072722a2695ddeca7b44d83dd3
          path: reference_toolbox
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: v1.0.0
          path: release_source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify immutable product, reference, sources and canonical bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C release_source rev-parse HEAD)" = "4dd8fbd8239d05f2c7932a9a9b3b7795f0a9ab27"
          test "$(git -C reference_toolbox rev-parse HEAD)" = "2437f4dc241541072722a2695ddeca7b44d83dd3"
          python -m pip install "numpy==2.3.5" ./release_source
          python work/benchmarks/runtime_v1/generate_inputs.py --output work/benchmarks/runtime_v1 --check
          python work/benchmarks/runtime_v1/export_release_configs.py --output work/benchmarks/runtime_v1 --check

      - name: HGFX exact-start 576-subject fixed-vector diagnostic
        shell: bash
        run: |
          python work/benchmarks/runtime_v1/all_subjects_hgfx.py \
            --input work/benchmarks/runtime_v1 \
            --output work/benchmarks/runtime_v1/cohort_results/hgfx_raw.json

      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a

      - name: MATLAB exact-start 576-subject fixed-vector diagnostic
        uses: matlab-actions/run-command@v3
        with:
          command: "addpath(fullfile(pwd,'work','benchmarks','runtime_v1','matlab')); all_subjects_matlab(fullfile(pwd,'work','benchmarks','runtime_v1'),fullfile(pwd,'reference_toolbox'),fullfile(pwd,'work','benchmarks','runtime_v1','cohort_results','matlab_raw.json'))"

      - name: Compare all subjects, all configurations, all statuses without timing
        id: comparison
        continue-on-error: true
        shell: bash
        run: |
          python work/benchmarks/runtime_v1/compare_all_subjects.py \
            --hgfx work/benchmarks/runtime_v1/cohort_results/hgfx_raw.json \
            --matlab work/benchmarks/runtime_v1/cohort_results/matlab_raw.json \
            --output work/benchmarks/runtime_v1/cohort_results/comparison.json

      - name: Preserve raw records (including any failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf01-all-subjects-${{ github.run_id }}
          path: work/benchmarks/runtime_v1/cohort_results/
          if-no-files-found: warn

      - name: Commit machine-readable analysis and raw SHA-256 provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=work/benchmarks/runtime_v1/cohort_results
          if test -f "$root/comparison.json"; then
            python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path("work/benchmarks/runtime_v1/cohort_results")
          o=json.loads((root/"comparison.json").read_text())
          o["github_run_id"]="${{ github.run_id }}"
          o["raw_evidence_sha256"]={
            name:hashlib.sha256((root/name).read_bytes()).hexdigest()
            for name in ("hgfx_raw.json","matlab_raw.json") if (root/name).is_file()
          }
          o["raw_evidence_location"]="GitHub Actions artifact perf01-all-subjects-${{ github.run_id }}"
          (root/"summary-${{ github.run_id }}.json").write_text(
            json.dumps(o,indent=2,sort_keys=True,allow_nan=False)+"\n"
          )
          PY
            git -C work config user.name 'github-actions[bot]'
            git -C work config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C work add benchmarks/runtime_v1/cohort_results/summary-${{ github.run_id }}.json
            git -C work commit -m 'evidence(perf01): record all-subject model/source audit ${{ github.run_id }}'
            git -C work fetch origin research/perf-01-preflight-fixtures
            git -C work rebase origin/research/perf-01-preflight-fixtures
            git -C work push origin HEAD:refs/heads/research/perf-01-preflight-fixtures
          else
            echo "No cohort comparator result; inspect raw artifact and logs."
          fi

      - name: Fail on unreviewed cohort asymmetry or configuration mismatch
        if: always()
        env:
          COMPARE_OUTCOME: ${{ steps.comparison.outcome }}
        run: |
          if test "$COMPARE_OUTCOME" = "failure"; then
            echo "Cohort scientific diagnostic mismatch; preserved evidence."
            exit 1
          fi
