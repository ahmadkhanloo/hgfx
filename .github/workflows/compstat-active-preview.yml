name: Computational Statistics active author-review PDF

on:
  push:
    branches: [compstat-revision]
    paths:
      - "paper/computational_statistics/manuscript.md"
      - "paper/SUPPLEMENTARY_APPENDICES.md"
      - "paper/references.bib"
      - "paper/figures/*.pdf"
      - "paper/computational_statistics/build_active_submission.py"
      - "tools/check_manuscript_claims.py"
      - "docs/planning/COMPSTAT_CLAIM_MAP.json"
      - ".github/workflows/compstat-active-preview.yml"
  pull_request:
    paths:
      - "paper/computational_statistics/manuscript.md"
      - "paper/SUPPLEMENTARY_APPENDICES.md"
      - "paper/references.bib"
      - "paper/figures/*.pdf"
      - "paper/computational_statistics/build_active_submission.py"
      - "tools/check_manuscript_claims.py"
      - "docs/planning/COMPSTAT_CLAIM_MAP.json"
      - ".github/workflows/compstat-active-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  author-review-preview:
    name: Editable LaTeX, PDF, and evidence of page limits (not scientific approval)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install document build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc \
            texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended \
            lmodern poppler-utils
      - name: Record precise source and build versions
        run: |
          git rev-parse HEAD
          python --version
          pandoc --version | head -2
          pdflatex --version | head -2
          pdfinfo -v 2>&1 | head -2
          git hash-object paper/computational_statistics/manuscript.md \
            paper/SUPPLEMENTARY_APPENDICES.md paper/references.bib \
            paper/computational_statistics/build_active_submission.py
      - name: Inventory scientific numeric claims without claiming complete coverage
        run: |
          mkdir -p paper/computational_statistics/active_preview
          python tools/check_manuscript_claims.py --allow-unmapped \
            --json-out paper/computational_statistics/active_preview/claim_inventory.json
      - name: Audit strict numerical claims and retain FAIL evidence without suppressing PDF build
        shell: bash
        run: |
          set +e
          python tools/check_manuscript_claims.py \
            --source paper/computational_statistics/manuscript.md \
            --source paper/SUPPLEMENTARY_APPENDICES.md \
            --json-out paper/computational_statistics/active_preview/claim_strict.json \
            > paper/computational_statistics/active_preview/claim_strict.log 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > paper/computational_statistics/active_preview/claim_strict_exit_code.txt
          cat paper/computational_statistics/active_preview/claim_strict.log
          echo "Strict claim audit exit: $status (0 only means token coverage/checks; independent scientific review still needed)"
          if [ "$status" -ne 0 ]; then
            echo "::warning::Strict manuscript numeric-claim coverage is NOT PASS; inspect claim_strict.json and claim_strict.log artifact."
          fi
      - name: Build only the current draft (no HGFX numerical execution)
        run: |
          python paper/computational_statistics/build_active_submission.py \
            --root . --outdir paper/computational_statistics/active_preview
      - name: Preserve generated source and logs even if page/compile gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compstat-active-author-review
          path: paper/computational_statistics/active_preview/
          retention-days: 30
          if-no-files-found: warn
      - name: Enforce strict claim-audit result after preserving review artifacts
        if: always()
        shell: bash
        run: |
          status_file=paper/computational_statistics/active_preview/claim_strict_exit_code.txt
          if [ ! -f "$status_file" ]; then
            echo "::error::Strict claim audit did not produce an exit-status record."
            exit 1
          fi
          status=$(cat "$status_file")
          if [ "$status" != "0" ]; then
            echo "::error::Strict numerical coverage is NOT PASS (exit $status). Review uploaded claim_strict.json and claim_strict.log."
            exit 1
          fi
          echo "Strict numeric token mapping passed; this is NOT independent scientific acceptance."
