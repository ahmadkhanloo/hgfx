name: M18 D08 Holdout Optimizer Diagnostic
on:
  push:
    branches: [main]
    paths:
      - 'docs/validation/M18_D08_HOLDOUT_OPTIMIZER_DIAGNOSTIC.md'
      - 'reference/matlab/export_m18_d08_holdout_optimizer_probe.m'
      - 'tools/check_m18_d08_holdout_optimizer_probe.py'
      - 'src/hgfx/**'
      - '.github/workflows/m18-d08-holdout-optimizer-diagnostic.yml'
  pull_request:
    paths:
      - 'docs/validation/M18_D08_HOLDOUT_OPTIMIZER_DIAGNOSTIC.md'
      - 'reference/matlab/export_m18_d08_holdout_optimizer_probe.m'
      - 'tools/check_m18_d08_holdout_optimizer_probe.py'
      - 'src/hgfx/**'
      - '.github/workflows/m18-d08-holdout-optimizer-diagnostic.yml'
  workflow_dispatch:

jobs:
  d08-holdout-optimizer-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: matlab-actions/setup-matlab@v2
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/verify_reference_freeze.py
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath(fullfile(pwd,'reference','matlab')); export_m18_d08_holdout_optimizer_probe(fullfile(pwd,'reference','generated','m18_d08_holdout_optimizer_probe.json'))
      - run: python tools/check_m18_d08_holdout_optimizer_probe.py reference/generated/m18_d08_holdout_optimizer_probe.json --output reference/generated/m18_d08_holdout_optimizer_probe_comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m18-d08-holdout-optimizer-diagnostic
          path: reference/generated/m18_d08_holdout_optimizer_probe*.json
          if-no-files-found: error
