name: "PERF-01D original x0 objective LL/prior terms from real source (untimed)"
on:
  workflow_dispatch:
  push:
    branches:
      - research/perf01d-x0-objective-term-decomposition
    paths:
      - '.github/workflows/perf01-x0-objective-terms.yml'
      - 'benchmarks/runtime_v1/decompose_original_x0_hgfx_objective.py'
      - 'benchmarks/runtime_v1/matlab/subject7_x0_matlab_objective_components.m'
      - 'benchmarks/runtime_v1/compare_original_x0_objective_terms.py'
      - 'tests/test_perf01_x0_objective_terms.py'
      - 'docs/research/PERF01D_OBJECTIVE_TERMS_X0_PRESPEC_2026-11-07.md'
permissions:
  contents: read
  actions: read
jobs:
  exact-original-71-source-constituents:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      JAX_PLATFORMS: cpu
      OPENBLAS_NUM_THREADS: '4'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: work
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: frozen-hgfx
          ref: v1.0.0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ComputationalPsychiatry/hgf-toolbox
          ref: 2437f4dc241541072722a2695ddeca7b44d83dd3
          path: frozen-matlab
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen original source identity and 14 independent original 63/64 controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C frozen-hgfx rev-parse HEAD)" = '4dd8fbd8239d05f2c7932a9a9b3b7795f0a9ab27'
          test "$(git -C frozen-matlab rev-parse HEAD)" = '2437f4dc241541072722a2695ddeca7b44d83dd3'
          python -m pip install "numpy==2.3.5" "scipy>=1.14,<2" ./frozen-hgfx
          python -m unittest discover -s work/tests -p 'test_perf01_x0_objective_terms.py' -v
          python work/benchmarks/runtime_v1/generate_inputs.py --output work/benchmarks/runtime_v1 --check
          python work/benchmarks/runtime_v1/export_release_configs.py --output work/benchmarks/runtime_v1 --check
      - name: Fetch unchanged genuine original x0 MATLAB private objective source and original BFGS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original-x0 original-bfgs output
          gh run download 42389292284 --repo "$GITHUB_REPOSITORY" \
            --name perf01d-original-ridders-start-stencils-42389292284 --dir original-x0
          gh run download 42187240378 --repo "$GITHUB_REPOSITORY" \
            --name perf01-subject7-bfgs-42187240378 --dir original-bfgs
          echo 'fd8ea94bbf85e6f01feb1d7477ae15a42f86026cc0704503c9e0f00c9803599d  original-x0/hgfx-first-ridders.json' | sha256sum -c -
          echo '1826535a8e15c522bc3c987978c15978e14a5594664fae25d618e6f9f22a4685  original-x0/matlab-first-private-ridders.json' | sha256sum -c -
          echo '13c2b32d10fbb508a651c954c13de3c674c5f06ae6a2bb1e641c710ec8abd0c6  original-x0/true-x0-both-stencils-cross-objective-audit.json' | sha256sum -c -
          echo '060247be69f8542cf0c7e30d5cf12fb93e12411737452a308e489fef9e220fce  original-bfgs/hgfx_raw.json' | sha256sum -c -
          echo '4816a4bf52c86d383363e6b957376e66e33a825be482de9ff3c75b557590ff2a  original-bfgs/matlab_raw.json' | sha256sum -c -
      - name: Replay frozen HGFX 71 source scalar evaluations, collect every 128-trial and prior term
        shell: bash
        run: |
          set -euo pipefail
          python work/benchmarks/runtime_v1/decompose_original_x0_hgfx_objective.py \
            --root work/benchmarks/runtime_v1 \
            --old-bfgs original-bfgs \
            --archive original-x0 \
            --output output/original-hgfx-71-objective-terms.json
          echo "$(cat output/original-hgfx-71-objective-terms.sha256)  output/original-hgfx-71-objective-terms.json" | sha256sum -c -
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Real frozen MATLAB native fitModel source constituent algebra at exactly all 71 original x
        uses: matlab-actions/run-command@v3
        with:
          command: "addpath(fullfile(pwd,'work','benchmarks','runtime_v1','matlab')); subject7_x0_matlab_objective_components(fullfile(pwd,'work','benchmarks','runtime_v1'),fullfile(pwd,'frozen-matlab'),fullfile(pwd,'output','original-hgfx-71-objective-terms.json'),fullfile(pwd,'output','original-hgfx-71-objective-terms.sha256'),fullfile(pwd,'output','original-matlab-71-objective-terms.json'))"
      - name: Independently verify all 71 original private scalar bits and report full trial/LL/prior divergence
        shell: bash
        run: |
          set -euo pipefail
          python work/benchmarks/runtime_v1/compare_original_x0_objective_terms.py \
            --hgfx output/original-hgfx-71-objective-terms.json \
            --matlab output/original-matlab-71-objective-terms.json \
            --original-archive original-x0 \
            --original-fit work/benchmarks/runtime_v1/fit_cohort_results/summary-41863441006.json \
            --output output/independent-71-node-likelihood-and-prior-source-audit.json
      - name: Preserve all raw real evidence and failed-run SHA/provenance
        if: always()
        shell: bash
        run: |
          mkdir -p output
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          path=Path('output')
          hashes={p.name:hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in path.iterdir() if p.is_file() and p.name!='provenance.json'}
          (path/'provenance.json').write_text(json.dumps({
            'schema':'perf01d-genuine-71-source-objective-terms-v1',
            'github_run_id':os.environ['GITHUB_RUN_ID'],
            'tested_sha':os.environ['GITHUB_SHA'],
            'preexecution_protocol_commit':'b9d76455601677c224767238802327704cda2023',
            'genuine_original_source_run':'42389292284',
            'frozen_hgfx':'4dd8fbd8239d05f2c7932a9a9b3b7795f0a9ab27',
            'frozen_matlab':'2437f4dc241541072722a2695ddeca7b44d83dd3',
            'original_public_fitting':'63/64 SCIENTIFIC NONPASS',
            'independent_review':'NOT_RECEIVED',
            'perf01c':'NOT_FROZEN',
            'paper_timing':'NOT_RUN',
            'physical_gpu':'NOT_RUN',
            'source_member_sha256':hashes,
          },sort_keys=True,indent=2)+'\n')
          print(json.dumps(hashes,sort_keys=True))
          PY
      - name: Archive full original constituent vectors and rejected experimental attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf01d-71-genuine-objective-source-terms-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
