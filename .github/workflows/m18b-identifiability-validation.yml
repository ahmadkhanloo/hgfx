name: M18B Identifiability-Aware Validation

on:
  push:
    branches:
      - feat/m18b-identifiability-aware-validation
      - fix/m18b-evidence-integrity
  pull_request:
  workflow_dispatch:

jobs:
  m18b-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Frozen reference guard
        run: python scripts/verify_reference_freeze.py
      - name: M18B unit tests
        run: python -m pytest tests/unit/test_m18b*.py -q
      - name: Full regression suite
        run: python -m pytest -q
      - name: M18B final gate
        run: >-
          python scripts/run_m18b_identifiability_validation.py
          --preset gate
          --output benchmarks/results/m18b_identifiability_validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m18b-identifiability-validation
          if-no-files-found: error
          path: benchmarks/results/m18b_identifiability_validation.json
