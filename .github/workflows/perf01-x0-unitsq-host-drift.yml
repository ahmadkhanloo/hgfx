name: "PERF-01D original 71x128 unitsq native math fresh CPU host replication"
on:
  workflow_dispatch:
  push:
    branches:
      - research/perf01d-x0-infstate-observation-source
    paths:
      - '.github/workflows/perf01-x0-unitsq-host-drift.yml'
      - 'benchmarks/runtime_v1/diagnose_original_x0_unitsq_host_drift.py'
      - 'tests/test_perf01_x0_unitsq_host_drift.py'
      - 'docs/research/PERF01D_UNITSQ_HOST_NUMERIC_DRIFT_PRESPEC_2026-11-07.md'
permissions:
  contents: read
  actions: read
jobs:
  original-source-fresh-host-replication:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      JAX_PLATFORMS: cpu
      OPENBLAS_NUM_THREADS: '4'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: work
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: frozen-hgfx
          ref: v1.0.0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen HGFX release and ten strict 128 trial source bit/CPU host controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C frozen-hgfx rev-parse HEAD)" = '4dd8fbd8239d05f2c7932a9a9b3b7795f0a9ab27'
          python -m pip install "numpy==2.3.5" "scipy>=1.14,<2" ./frozen-hgfx
          python -m unittest discover -s work/tests -p 'test_perf01_x0_unitsq_host_drift.py' -v
          python work/benchmarks/runtime_v1/generate_inputs.py --output work/benchmarks/runtime_v1 --check
      - name: Download genuine unchanged 71 original source HGF infStates and exact 63/64 failure controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p real-stage original-terms original-x0 old-bfgs output
          gh run download 42404444341 --repo "$GITHUB_REPOSITORY" \
            --name perf01d-real-x0-hgf-infstates-unitsq-stage-42404444341 --dir real-stage
          echo '53c998070dbbfc8b8a5c5ce7e8d962b44f9820635f60c567fd2012bf48fcd415  real-stage/original-hgfx-71-infstates-and-native-ll.json' | sha256sum -c -
          echo '15c2f3e50d3ff257d333e412b881053cd6bc0240137ddbae448b3ce7d1647006  real-stage/original-matlab-71-infstates-and-cross-ll.json' | sha256sum -c -
          echo '5d1d03f200bb8be7bf058fe54d64e63ab8909a29857a6750014bad83db029af0  real-stage/independent-hgf-infstates-unitsq-71-source-stage.json' | sha256sum -c -
          gh run download 42402421462 --repo "$GITHUB_REPOSITORY" \
            --name perf01d-71-genuine-objective-source-terms-42402421462 --dir original-terms
          echo 'eb085a07e633aa10979602d9f9fb5e9221e2a1132aecd9fb7b73953a4d2850df  original-terms/original-hgfx-71-objective-terms.json' | sha256sum -c -
          gh run download 42389292284 --repo "$GITHUB_REPOSITORY" \
            --name perf01d-original-ridders-start-stencils-42389292284 --dir original-x0
          echo 'fd8ea94bbf85e6f01feb1d7477ae15a42f86026cc0704503c9e0f00c9803599d  original-x0/hgfx-first-ridders.json' | sha256sum -c -
          gh run download 42187240378 --repo "$GITHUB_REPOSITORY" \
            --name perf01-subject7-bfgs-42187240378 --dir old-bfgs
          echo '060247be69f8542cf0c7e30d5cf12fb93e12411737452a308e489fef9e220fce  old-bfgs/hgfx_raw.json' | sha256sum -c -
          echo '4816a4bf52c86d383363e6b957376e66e33a825be482de9ff3c75b557590ff2a  old-bfgs/matlab_raw.json' | sha256sum -c -
      - name: Run unchanged original HGFX unitsq on exactly the same original 71x128 HGF source arrays and capture CPU flags/diffs
        shell: bash
        run: |
          set -euo pipefail
          python work/benchmarks/runtime_v1/diagnose_original_x0_unitsq_host_drift.py \
            --real-stage real-stage \
            --old-terms original-terms \
            --old-x original-x0 \
            --old-bfgs old-bfgs \
            --original-fit-root work/benchmarks/runtime_v1 \
            --replica ${{ matrix.replica }} \
            --output output/original-source-unitsq-replay-host-${{ matrix.replica }}.json
      - name: Preserve all original source/nonmatch CPU evidence, SHA and original scientific failure
        if: always()
        shell: bash
        run: |
          mkdir -p output
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,os
          p=Path('output')
          sha={z.name:hashlib.sha256(z.read_bytes()).hexdigest()
               for z in p.glob('*.json') if z.name!='provenance.json'}
          (p/'provenance.json').write_text(json.dumps({
            'schema':'perf01d-real-same-raw-source-unitsq-multihost-4rep-v1',
            'run_id':os.environ['GITHUB_RUN_ID'],
            'tested_commit':os.environ['GITHUB_SHA'],
            'prespec_commit':'d22b52f285201b2cecff2d5d54073b17256520bf',
            'original_source_run':'42404444341',
            'original_source_sha':'a6168bb2b1be07a0f084abc07599e9ffda61b22b',
            'frozen_hgfx':'4dd8fbd8239d05f2c7932a9a9b3b7795f0a9ab27',
            'original_fitting':'63/64 SCIENTIFIC NONPASS',
            'independent_review':'NOT_RECEIVED',
            'perf01c':'NOT_FROZEN','paper_timing':'NOT_RUN','physical_gpu':'NOT_RUN',
            'derived_sha256':sha,
          },sort_keys=True,indent=2)+'\n')
          print(json.dumps(sha,sort_keys=True))
          PY
      - name: Preserve ALL four original unchanged native observation host outcomes including fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf01d-original-unitsq-cpuhost-replica-${{ matrix.replica }}-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
