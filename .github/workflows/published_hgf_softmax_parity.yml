name: Published Real-Data Softmax MATLAB vs HGFX

on:
  pull_request:
    paths:
      - 'paper/case_studies/PUBLISHED_REALDATA_SOFTMAX_PROTOCOL_2026-11-04.md'
      - 'paper/case_studies/run_fullcohort_softmax_matlab.m'
      - 'paper/case_studies/compare_fullcohort_softmax.py'
      - 'tests/paper/test_published_softmax.py'
      - '.github/workflows/published_hgf_softmax_parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-matlab-response-likelihood:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JAX_ENABLE_X64: 'true'
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact released wheel and test dependencies
        run: |
          python -m pip install 'hgfx==1.0.0' 'scipy==1.14.1' 'pytest'
          python -c "from importlib.metadata import version; assert version('hgfx')=='1.0.0'"
      - name: Verify frozen MATLAB oracle
        run: python scripts/verify_reference_freeze.py
      - name: Check frozen M7 numerical contract before real-data comparison
        run: python -m pytest -q tests/paper/test_published_softmax.py
      - name: Acquire complete study inputs with exact hashes and source scope
        run: python paper/case_studies/prepare_fullcohort_pair.py published_pair_tmp
      - name: Install physical MATLAB runtime
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
      - name: Execute original fixed-vector MAB forward in MATLAB 8.2
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('paper/case_studies'); run_fullcohort_matlab
      - name: Execute original multinomial softmax likelihood in MATLAB
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('paper/case_studies'); run_fullcohort_softmax_matlab
      - name: Compare M7 responses with stable HGFX 1.0.0, all 324 cases
        run: python paper/case_studies/compare_fullcohort_softmax.py published_pair_tmp published_softmax_aggregate.json
      - name: Upload aggregate results only (no participant data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-published-source-fixed-softmax-likelihood
          path: published_softmax_aggregate.json
          if-no-files-found: warn
