name: arXiv Reader Figures

on:
  push:
    branches:
      - main
    paths:
      - 'paper/scripts/generate_arxiv_reader_figures.py'
      - 'paper/arxiv/**'
      - 'paper/reproducibility/p2a10_*.json'
      - 'paper/reproducibility/p3_m18c2_*.json'
      - 'reference/validation/m18_d02_reference_limitation/decision.json'
      - 'reference/validation/m18_d08_reference_limitation/decision.json'
      - 'reference/validation/m18_s7_reference_limitation/decision.json'
      - 'gpu_validation_results/m18_s9_physical_gpu_revalidation.json'
      - '.github/workflows/arxiv-reader-figures.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  arxiv-reader-figures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install plotting dependencies
        run: python -m pip install 'numpy==2.3.3' 'matplotlib==3.10.9'
      - name: Syntax-check generator
        run: python -m py_compile paper/scripts/generate_arxiv_reader_figures.py
      - name: Generate reader-facing figures
        run: python paper/scripts/generate_arxiv_reader_figures.py
      - name: Check arXiv manuscript language
        shell: bash
        run: |
          if grep -nE '\\b(PASS|FAIL)\\b' paper/arxiv/manuscript.md; then
            echo 'Reader-facing manuscript contains internal PASS/FAIL status language.'
            exit 1
          fi
      - name: List generated files
        run: find paper/arxiv/figures -maxdepth 1 -type f -printf '%f\n' | sort
      - name: Commit rendered arXiv figures
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/arxiv/figures
          if git diff --cached --quiet; then
            echo "Rendered figures already match the committed outputs."
            exit 0
          fi
          git commit -m "paper: render arXiv reader figures"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: arxiv-reader-figures
          path: paper/arxiv/figures/
          if-no-files-found: error
