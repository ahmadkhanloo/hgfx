name: M13 API Compatibility

on:
  push:
    branches:
      - main
      - work/m13-api-compatibility
  pull_request:
  workflow_dispatch:

jobs:
  api-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Frozen reference guard
        run: python scripts/verify_reference_freeze.py
      - name: M13 public API and downstream consumers
        run: pytest tests/unit/test_m13_api_compatibility.py tests/unit/test_compat_fitting.py tests/unit/test_simulation.py -q
      - name: Full regression suite
        run: pytest -q
