name: M11 Simulation Parity

on:
  push:
    branches:
      - main
      - work/m11-simulation-parity
      - migration/M11-simulation-parity
  pull_request:
  workflow_dispatch:

jobs:
  python-simulation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Run M11 and upstream regressions
        run: pytest tests/unit/test_simulation.py tests/unit/test_observations.py tests/unit/test_hgf_forward.py tests/unit/test_objective.py -q

  matlab-python-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: matlab-actions/setup-matlab@v2
      - run: python -m pip install -e .
      - name: Verify frozen HGF reference
        run: python scripts/verify_reference_freeze.py
      - name: Export simulation and sampling oracle from MATLAB
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(fullfile(pwd,'reference','matlab')); export_m11_simulation_parity(fullfile(pwd,'reference','generated','m11_simulation_parity.json'))
      - name: Compare MATLAB and Python M11 results
        run: python tools/check_m11_parity.py reference/generated/m11_simulation_parity.json
