name: Published-Input MATLAB HGFX Forward Parity

on:
  pull_request:
    paths:
      - 'paper/case_studies/prepare_realdata_pair.py'
      - 'paper/case_studies/run_published_realdata_matlab.m'
      - 'paper/case_studies/compare_realdata_pair.py'
      - 'paper/case_studies/PUBLISHED_REALDATA_PAIR_PROTOCOL_2026-11-04.md'
      - '.github/workflows/published_hgf_paired_matlab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-pinned-matlab-vs-wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      JAX_ENABLE_X64: 'true'
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install released wheel, not editable source
        run: |
          python -m pip install 'hgfx==1.0.0' 'scipy==1.14.1'
          python -c "import importlib.metadata, hgfx; print('HGFX WHEEL', importlib.metadata.version('hgfx'), hgfx.__file__); assert importlib.metadata.version('hgfx')=='1.0.0'"
      - name: Freeze MATLAB toolbox reference identity
        run: python scripts/verify_reference_freeze.py
      - name: Download first preregistered case per study and validate trial coding
        run: python paper/case_studies/prepare_realdata_pair.py published_pair_tmp
      - name: Install actual MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
      - name: Evaluate real published input with MATLAB HGF 8.2.0
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('paper/case_studies'); run_published_realdata_matlab
      - name: Compare every reference state with actual HGFX 1.0.0 CPU x64
        run: python paper/case_studies/compare_realdata_pair.py published_pair_tmp published_pair_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-two-study-forward-metrics-only
          path: published_pair_summary.json
          if-no-files-found: warn
