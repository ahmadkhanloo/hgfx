name: M12B-C MAB JGET Parity

on:
  push:
    branches:
      - main
      - work/m12-complete-model-coverage
  pull_request:
  workflow_dispatch:

jobs:
  matlab-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: matlab-actions/setup-matlab@v2
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/verify_reference_freeze.py
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath(fullfile(pwd,'reference','matlab')); export_m12bc_parity(fullfile(pwd,'reference','generated','m12bc.json'))
      - run: python tools/check_m12bc_parity.py reference/generated/m12bc.json
      - run: pytest tests/unit/test_complete_model_surface.py -q
