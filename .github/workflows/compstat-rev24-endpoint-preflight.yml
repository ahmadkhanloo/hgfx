name: CompStat REV-2.4 original endpoint source preflight (NO SCIENCE)

on:
  push:
    branches:
      - compstat-revision
    paths:
      - 'tools/compstat_rev24_endpoint_sources.py'
      - 'tests/paper/test_compstat_rev24_endpoint_sources.py'
      - 'tests/paper/test_compstat_rev24_endpoint_coverage.py'
      - 'tools/compstat_rev24_endpoint_coverage.py'
      - 'tools/compstat_rev24_panel_e_inputs.py'
      - 'tests/paper/test_compstat_rev24_panel_e_inputs.py'
      - 'tools/compstat_rev24_panel_e_hgfx.py'
      - 'tools/compstat_rev24_panel_e_compare.py'
      - 'tests/paper/test_compstat_rev24_panel_e_objectives.py'
      - 'reference/matlab/run_compstat_rev24_panel_e_matlab.m'
      - 'tests/paper/test_compstat_rev24_matlab_source_contract.py'
      - 'reference/matlab/run_compstat_rev24_matlab.m'
      - '.github/workflows/compstat-rev24-endpoint-preflight.yml'
  pull_request:
    paths:
      - 'tools/compstat_rev24_endpoint_sources.py'
      - 'tests/paper/test_compstat_rev24_endpoint_sources.py'
      - 'tests/paper/test_compstat_rev24_endpoint_coverage.py'
      - 'tools/compstat_rev24_endpoint_coverage.py'
      - 'tools/compstat_rev24_panel_e_inputs.py'
      - 'tests/paper/test_compstat_rev24_panel_e_inputs.py'
      - 'tools/compstat_rev24_panel_e_hgfx.py'
      - 'tools/compstat_rev24_panel_e_compare.py'
      - 'tests/paper/test_compstat_rev24_panel_e_objectives.py'
      - 'reference/matlab/run_compstat_rev24_panel_e_matlab.m'
      - 'tests/paper/test_compstat_rev24_matlab_source_contract.py'
      - 'reference/matlab/run_compstat_rev24_matlab.m'
      - '.github/workflows/compstat-rev24-endpoint-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  archive-source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only NumPy contract dependency
        run: python -m pip install 'numpy==2.0.2'
      - name: Test Panel E original endpoint output contracts (synthetic, NO science)
        run: python -m unittest discover -s tests/paper -p 'test_compstat_rev24_panel_e_objectives.py' -v
      - name: Verify static endpoint and MATLAB dispatch contracts (NOT science)
        run: |
          python -m unittest discover -s tests/paper -p 'test_compstat_rev24_endpoint_sources.py' -v
          python -m unittest discover -s tests/paper -p 'test_compstat_rev24_matlab_source_contract.py' -v
      - name: Pin original cohort input fixture at its executing commit
        uses: actions/checkout@v4
        with:
          ref: 81ae256b318e18ea08b03ab6fcb69100ac6c836d
          path: rev24_original_input_source
          persist-credentials: false
      - name: Verify endpoint source-coverage fail-closed unit contracts
        run: python -m unittest discover -s tests/paper -p 'test_compstat_rev24_endpoint_coverage.py' -v
      - name: Download original historical evidence archives (no refitting)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p rev24_endpoint_archives
          for entry in 'd02:10339454535' 'd08:10339403480' 'cohort64:13341288055'; do
            label="${entry%%:*}"
            id="${entry##*:}"
            curl --fail --location --retry 2 --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${REPO}/actions/artifacts/${id}/zip" \
              --output "rev24_endpoint_archives/${label}.zip"
          done
      - name: Verify pinned ZIP bytes and original 64-cohort raw-file digests
        run: |
          python -m tools.compstat_rev24_endpoint_sources \
            --d02 rev24_endpoint_archives/d02.zip \
            --d08 rev24_endpoint_archives/d08.zip \
            --cohort64 rev24_endpoint_archives/cohort64.zip \
            --output rev24_endpoint_archives/source_audit.json
          echo 'ARCHIVE INTEGRITY ONLY: no endpoint extraction or MATLAB/HGFX evaluation'
      - name: Audit exact D02 D08 and original 64-subject endpoint coverage (NO science)
        run: |
          python -m tools.compstat_rev24_endpoint_coverage \
            --d02 rev24_endpoint_archives/d02.zip \
            --d08 rev24_endpoint_archives/d08.zip \
            --cohort64 rev24_endpoint_archives/cohort64.zip \
            --cohort-input rev24_original_input_source/benchmarks/runtime_v1/inputs/binary_128_s64.json \
            --output rev24_endpoint_archives/coverage_audit.json
          echo 'SOURCE COVERAGE ONLY: original D02 HGFX full endpoint still missing'
      - name: Validate private original-endpoint packaging contracts (synthetic, no science)
        run: python -m unittest discover -s tests/paper -p 'test_compstat_rev24_panel_e_inputs.py' -v
      - name: Construct and immediately remove PRIVATE Panel E input manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rev24_private
          trap 'rm -rf rev24_private' EXIT
          python -m tools.compstat_rev24_panel_e_inputs \
            --d02 rev24_endpoint_archives/d02.zip \
            --d08 rev24_endpoint_archives/d08.zip \
            --cohort64 rev24_endpoint_archives/cohort64.zip \
            --cohort-input rev24_original_input_source/benchmarks/runtime_v1/inputs/binary_128_s64.json \
            --private-output rev24_private/panel_e_inputs.json \
            --audit-output rev24_endpoint_archives/panel_e_inputs_audit.json
          test -s rev24_private/panel_e_inputs.json
          echo 'Private Panel E input manifest built; never upload trial data or endpoints; NO objectives evaluated'
      - name: Publish sanitized source-only audit (never publish participant-level raw ZIP)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compstat-rev24-panel-e-source-preflight
          path: |
            rev24_endpoint_archives/source_audit.json
            rev24_endpoint_archives/coverage_audit.json
            rev24_endpoint_archives/panel_e_inputs_audit.json
          if-no-files-found: warn
          retention-days: 90
