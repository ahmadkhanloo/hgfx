name: PERF-01D subject-7 archived-endpoint scientific replay (not timed)

on:
  workflow_dispatch:
  push:
    branches:
      - research/perf-01-preflight-fixtures
    paths:
      - 'benchmarks/runtime_v1/subject7_cross_replay_hgfx.py'
      - 'benchmarks/runtime_v1/matlab/subject7_cross_replay_matlab.m'
      - 'benchmarks/runtime_v1/compare_subject7_replay.py'
      - '.github/workflows/perf01-subject7-replay.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: perf01-subject7-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  same-vector:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JAX_PLATFORMS: cpu
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: work
      - uses: actions/checkout@v4
        with:
          repository: ComputationalPsychiatry/hgf-toolbox
          ref: 2437f4dc241541072722a2695ddeca7b44d83dd3
          path: reference_toolbox
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: v1.0.0
          path: release_source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify scientific source and reinstall exact HGFX v1
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C release_source rev-parse HEAD)" = "4dd8fbd8239d05f2c7932a9a9b3b7795f0a9ab27"
          test "$(git -C reference_toolbox rev-parse HEAD)" = "2437f4dc241541072722a2695ddeca7b44d83dd3"
          python -m pip install "numpy==2.3.5" ./release_source
          python work/benchmarks/runtime_v1/generate_inputs.py --output work/benchmarks/runtime_v1 --check
          python work/benchmarks/runtime_v1/export_release_configs.py --output work/benchmarks/runtime_v1 --check
      - name: Retrieve unchanged original 64-fit archived endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/benchmarks/runtime_v1/fit_cohort_results
          gh run download 41863441006 \
            --repo ahmadkhanloo/hgfx \
            --name perf01-64-full-fits-41863441006 \
            --dir work/benchmarks/runtime_v1/fit_cohort_results
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path("work/benchmarks/runtime_v1/fit_cohort_results")
          report=json.loads((root/"summary-41863441006.json").read_bytes())
          assert report["classification_counts"]=={
              "FIT_NUMERICAL_OR_TRAJECTORY_MISMATCH":1,
              "FIT_OUTPUTS_WITHIN_EXISTING_DIAGNOSTIC_TOLERANCES":63,
          }
          for name in ("hgfx_raw.json","matlab_raw.json"):
              actual=hashlib.sha256((root/name).read_bytes()).hexdigest()
              assert actual == report["raw_evidence_sha256"][name], name
          print("Exact original raw fitted endpoints and report hashes matched")
          PY
      - name: HGFX same-vector forward at BOTH archived subject-7 endpoints
        shell: bash
        run: |
          python work/benchmarks/runtime_v1/subject7_cross_replay_hgfx.py \
            --input work/benchmarks/runtime_v1 \
            --fitting work/benchmarks/runtime_v1/fit_cohort_results \
            --output work/benchmarks/runtime_v1/subject7_results/hgfx_raw.json
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: MATLAB same-vector forward at BOTH archived subject-7 endpoints
        uses: matlab-actions/run-command@v3
        with:
          command: "addpath(fullfile(pwd,'work','benchmarks','runtime_v1','matlab')); subject7_cross_replay_matlab(fullfile(pwd,'work','benchmarks','runtime_v1'),fullfile(pwd,'reference_toolbox'),fullfile(pwd,'work','benchmarks','runtime_v1','fit_cohort_results'),fullfile(pwd,'work','benchmarks','runtime_v1','subject7_results','matlab_raw.json'))"
      - name: Classify true same-parameter inference versus fitted-endpoint drift
        id: compare
        continue-on-error: true
        shell: bash
        run: |
          python work/benchmarks/runtime_v1/compare_subject7_replay.py \
            --hgfx work/benchmarks/runtime_v1/subject7_results/hgfx_raw.json \
            --matlab work/benchmarks/runtime_v1/subject7_results/matlab_raw.json \
            --output work/benchmarks/runtime_v1/subject7_results/comparison.json

      - name: Preserve original cross-replay raw results and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf01-subject7-same-vector-${{ github.run_id }}
          path: work/benchmarks/runtime_v1/subject7_results/
          if-no-files-found: warn

      - name: Commit run-specific same-parameter report and raw artifact hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=work/benchmarks/runtime_v1/subject7_results
          if test -f "$root/comparison.json"; then
            python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("work/benchmarks/runtime_v1/subject7_results")
          obj=json.loads((root/"comparison.json").read_bytes())
          obj["github_run_id"]="${{ github.run_id }}"
          obj["raw_evidence_sha256"]={
            n:hashlib.sha256((root/n).read_bytes()).hexdigest()
            for n in ("hgfx_raw.json","matlab_raw.json") if (root/n).exists()
          }
          obj["raw_evidence_location"]="GitHub Actions artifact perf01-subject7-same-vector-${{ github.run_id }}"
          (root/"summary-${{ github.run_id }}.json").write_text(
            json.dumps(obj,sort_keys=True,indent=2,allow_nan=False)+"\n"
          )
          PY
            git -C work config user.name 'github-actions[bot]'
            git -C work config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C work add benchmarks/runtime_v1/subject7_results/summary-${{ github.run_id }}.json
            git -C work commit -m 'evidence(perf01): preserve unchanged subject-7 endpoint cross-replay ${{ github.run_id }}'
            git -C work fetch origin research/perf-01-preflight-fixtures
            git -C work rebase origin/research/perf-01-preflight-fixtures
            git -C work push origin HEAD:refs/heads/research/perf-01-preflight-fixtures
          fi
      - name: Keep unresolved same-vector scientific discrepancy as failing status
        if: always()
        env:
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
        run: |
          if test "$COMPARE_OUTCOME" != "success"; then
            echo "Subject-7 same-vector diagnostic NOT verified; all evidence retained."
            exit 1
          fi
