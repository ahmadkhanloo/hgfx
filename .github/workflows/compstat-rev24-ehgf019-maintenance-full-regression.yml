name: REV-2.4 eHGF019 one-shot full CPU regression (MAINTENANCE ONLY)

# Full repository CPU CI once at end of this maintenance phase.
# Source branch 1.1.0b1, no original v1.0.0 MATLAB/Panel G/E execution.
on:
  push:
    branches: [compstat-revision]
    paths:
      - 'evidence/revision/protocols/REV-2.4_EHGF019_FULL_REGRESSION_KICKOFF_2026-11-10.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-cpu-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      JAX_ENABLE_X64: 'true'
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install current development source and dev tests
        run: python -m pip install -e '.[dev]'
      - name: Verify 334 pinned frozen MATLAB source identities; NO oracle execution
        run: python scripts/verify_reference_freeze.py
      - name: Complete CPU test suite at 1.1.0b1 (NOT frozen release science)
        run: pytest -q --junitxml=regression-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rev24-ehgf019-maintenance-full-cpu-${{ runner.os }}
          path: regression-results.xml
          if-no-files-found: warn
          retention-days: 90
