name: PERF-01D MATLAB-only subject-7 optimizer self-sensitivity (untimed)

on:
  workflow_dispatch:
  push:
    branches:
      - research/perf-01-preflight-fixtures
    paths:
      - 'benchmarks/runtime_v1/matlab/subject7_matlab_reference_sensitivity.m'
      - '.github/workflows/perf01-matlab-sensitivity.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: perf01-reference-sensitivity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matlab-self-sensitivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: work
      - uses: actions/checkout@v4
        with:
          repository: ComputationalPsychiatry/hgf-toolbox
          ref: 2437f4dc241541072722a2695ddeca7b44d83dd3
          path: reference_toolbox
          persist-credentials: false
      - name: Verify oracle and download exact original full-fit evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C reference_toolbox rev-parse HEAD)" = "2437f4dc241541072722a2695ddeca7b44d83dd3"
          root=work/benchmarks/runtime_v1/fit_cohort_results
          mkdir -p "$root"
          gh run download 41863441006 \
            --repo ahmadkhanloo/hgfx \
            --name perf01-64-full-fits-41863441006 \
            --dir "$root"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("work/benchmarks/runtime_v1/fit_cohort_results")
          evidence=json.loads((root/"summary-41863441006.json").read_bytes())
          assert evidence["classification_counts"]=={
            "FIT_NUMERICAL_OR_TRAJECTORY_MISMATCH":1,
            "FIT_OUTPUTS_WITHIN_EXISTING_DIAGNOSTIC_TOLERANCES":63,
          }
          for src in ("hgfx_raw.json","matlab_raw.json"):
            assert hashlib.sha256((root/src).read_bytes()).hexdigest() == evidence["raw_evidence_sha256"][src]
          print("Original full-fit report and both raw artifacts verified byte for byte")
          PY
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Baseline-reproduce exact MATLAB objective before six one-ULP probes
        id: sensitivity
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: "addpath(fullfile(pwd,'work','benchmarks','runtime_v1','matlab')); subject7_matlab_reference_sensitivity(fullfile(pwd,'work','benchmarks','runtime_v1'),fullfile(pwd,'reference_toolbox'),fullfile(pwd,'work','benchmarks','runtime_v1','fit_cohort_results'),fullfile(pwd,'work','benchmarks','runtime_v1','matlab_sensitivity_results','run-${{ github.run_id }}.json'))"

      - name: Preserve reference-only raw probe even on baseline mismatch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf01-matlab-reference-self-sensitivity-${{ github.run_id }}
          path: work/benchmarks/runtime_v1/matlab_sensitivity_results/
          if-no-files-found: warn

      - name: Commit provenance of reference-only sensitivity as a diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          file=work/benchmarks/runtime_v1/matlab_sensitivity_results/run-${{ github.run_id }}.json
          if test -f "$file"; then
            python - <<'PY'
          import hashlib,json
          from pathlib import Path
          folder=Path("work/benchmarks/runtime_v1/matlab_sensitivity_results")
          path=folder/"run-${{ github.run_id }}.json"
          report=json.loads(path.read_bytes())
          report["workflow_id"]="${{ github.run_id }}"
          report["raw_evidence_sha256"]=hashlib.sha256(path.read_bytes()).hexdigest()
          report["original_artifact"]="perf01-64-full-fits-41863441006"
          (folder/"summary-${{ github.run_id }}.json").write_text(
            json.dumps(report,indent=2,sort_keys=True,allow_nan=False)+"\n"
          )
          PY
            git -C work config user.name 'github-actions[bot]'
            git -C work config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C work add benchmarks/runtime_v1/matlab_sensitivity_results/summary-${{ github.run_id }}.json
            git -C work commit -m 'evidence(perf01): preserve frozen-reference-only sensitivity diagnostic ${{ github.run_id }}'
            git -C work fetch origin research/perf-01-preflight-fixtures
            git -C work rebase origin/research/perf-01-preflight-fixtures
            git -C work push origin HEAD:refs/heads/research/perf-01-preflight-fixtures
          fi
      - name: Fail-closed when independent reference objective baseline cannot be reproduced
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.sensitivity.outcome }}
        run: |
          if test "$PROBE_OUTCOME" != "success"; then
            echo "Reference-only sensitivity baseline not verified. See archived raw probe."
            exit 1
          fi
