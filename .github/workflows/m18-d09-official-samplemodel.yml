name: M18 D09 Official sampleModel

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/m18-d09-official-samplemodel.yml'
      - 'docs/validation/M18_D09_OFFICIAL_SAMPLEMODEL.md'
      - 'reference/matlab/export_m18_d09_official_samplemodel.m'
      - 'tools/check_m18_d09_official_samplemodel.py'
      - 'src/hgfx/compat/sample.py'
      - 'src/hgfx/compat/simulation.py'

jobs:
  d09-official-samplemodel:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
      - name: Install HGFX
        run: python -m pip install -e .
      - name: Verify frozen MATLAB reference
        run: python scripts/verify_reference_freeze.py
      - name: Export official MATLAB sampleModel demo cases
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(fullfile(pwd,'reference','matlab')); export_m18_d09_official_samplemodel(fullfile(pwd,'reference','generated','m18_d09_official_samplemodel.json'))
      - name: Check paired D09 parity
        run: python tools/check_m18_d09_official_samplemodel.py reference/generated/m18_d09_official_samplemodel.json --output reference/generated/m18_d09_official_samplemodel_comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m18-d09-official-samplemodel
          path: |
            reference/generated/m18_d09_official_samplemodel.json
            reference/generated/m18_d09_official_samplemodel_comparison.json
