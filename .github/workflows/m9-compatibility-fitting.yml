name: M9 Compatibility Fitting

on:
  push:
    branches:
      - main
      - migration/M9-compatibility-fitting
  pull_request:
  workflow_dispatch:

jobs:
  python-compat-fitting-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Run compatibility fitting and upstream regression tests
        run: pytest tests/unit/test_compat_fitting.py tests/unit/test_objective.py tests/unit/test_scalar_math.py -q

  matlab-python-compat-fitting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: matlab-actions/setup-matlab@v2
      - run: python -m pip install -e .
      - name: Verify frozen HGF reference
        run: python scripts/verify_reference_freeze.py
      - name: Export compatibility optimizer and MAP oracle from MATLAB
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(fullfile(pwd,'reference','matlab')); export_m9_compat_fitting(fullfile(pwd,'reference','generated','m9_compat_fitting.json'))
      - name: Compare MATLAB and Python fitting results
        run: python tools/check_m9_parity.py reference/generated/m9_compat_fitting.json
