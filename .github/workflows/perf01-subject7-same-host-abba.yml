name: "PERF-01D Issue90: fixed-affinity ABBA four-process original subject7 refits (untimed)"

on:
  workflow_dispatch:
  push:
    branches:
      - research/perf-01-preflight-fixtures
    paths:
      - '.github/workflows/perf01-subject7-same-host-abba.yml'
      - 'benchmarks/runtime_v1/compare_subject7_same_host_repeatability.py'
      - 'tests/test_perf01_subject7_same_host_repeatability.py'

permissions:
  contents: write
  actions: read

concurrency:
  group: perf01-issue90-abba-single-runner
  cancel-in-progress: false

jobs:
  original-scientific-trajectory:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      GH_TOKEN: ${{ github.token }}
      JAX_PLATFORMS: cpu
      OPENBLAS_NUM_THREADS: '4'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: work
      - uses: actions/checkout@v4
        with:
          ref: v1.0.0
          path: frozen-release
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lock untouched frozen HGFX source, 12 new ABBA and original science guards, canonical data
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C frozen-release rev-parse HEAD)" = "4dd8fbd8239d05f2c7932a9a9b3b7795f0a9ab27"
          python -m pip install 'numpy==2.3.5' threadpoolctl ./frozen-release
          python -m unittest discover -s work/tests -p test_perf01_subject7_same_host_repeatability.py -v
          python -m unittest discover -s work/tests -p test_perf01_subject7_full_trajectory.py -v
          python -m unittest discover -s work/tests -p test_perf01_fit_cohort.py -v
          python work/benchmarks/runtime_v1/generate_inputs.py \
            --output work/benchmarks/runtime_v1 --check
          python work/benchmarks/runtime_v1/export_release_configs.py \
            --output work/benchmarks/runtime_v1 --check

      - name: Restore original complete 64-case MATLAB and HGFX source evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original-64 out
          gh run download 41863441006 --repo "$GITHUB_REPOSITORY" \
            --name perf01-64-full-fits-41863441006 --dir original-64
          cp work/benchmarks/runtime_v1/fit_cohort_results/summary-41863441006.json original-64/
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path("original-64")
          s=json.loads((root/"summary-41863441006.json").read_bytes())
          assert s["hgfx_sha"]=="4dd8fbd8239d05f2c7932a9a9b3b7795f0a9ab27"
          assert s["matlab_sha"]=="2437f4dc241541072722a2695ddeca7b44d83dd3"
          assert s["classification_counts"]=={
              "FIT_NUMERICAL_OR_TRAJECTORY_MISMATCH":1,
              "FIT_OUTPUTS_WITHIN_EXISTING_DIAGNOSTIC_TOLERANCES":63}
          assert s["cases"][7]["mismatched_fields"]==["traj.mu","traj.muhat"]
          for name,d in s["raw_evidence_sha256"].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==d,name
          print("Original scientific NON-PASS and both exact original raw SHA256 retained")
          PY

      - name: Predeclare four allowed logical CPU cores (no post-hoc CPU selection)
        shell: bash
        run: |
          set -euo pipefail
          command -v taskset
          python - <<'PY'
          import json,os
          from pathlib import Path
          allowed=sorted(os.sched_getaffinity(0))
          assert len(allowed)>=4,"Need four allowed logical cores; do not shrink protocol"
          Path("out/cpu-set.json").write_text(json.dumps({
              "allowed_logical_cpus":allowed,"chosen_logical_cpus":allowed[:4],
              "order":["auto_1","Haswell_1","Haswell_2","auto_2"]},sort_keys=True)+"\n")
          PY

      - name: Execute four separate frozen HGFX public fits on same four CPUs, without timers
        shell: bash
        run: |
          set -euo pipefail
          export ABBA_CPU_SET="$(python -c "import json; print(','.join(map(str,json.load(open('out/cpu-set.json'))['chosen_logical_cpus'])))")"
          for sample in auto_1 Haswell_1 Haswell_2 auto_2; do
            case "$sample" in
              auto_*) unset OPENBLAS_CORETYPE || true ;;
              Haswell_*) export OPENBLAS_CORETYPE=Haswell ;;
              *) exit 1 ;;
            esac
            export ABBA_SAMPLE="$sample"
            taskset -c "$ABBA_CPU_SET" python work/benchmarks/runtime_v1/export_subject7_full_fit_trajectory.py \
              --input work/benchmarks/runtime_v1 --original original-64 \
              --output "out/${sample}_raw.json"
            taskset -c "$ABBA_CPU_SET" python - <<'PY'
          import hashlib,json,os,platform,sys,numpy as np
          from pathlib import Path
          from threadpoolctl import threadpool_info
          name=os.environ["ABBA_SAMPLE"]
          cores=json.loads(Path("out/cpu-set.json").read_text())["chosen_logical_cpus"]
          model=next((s.partition(":")[2].strip() for s in Path("/proc/cpuinfo").read_text().splitlines()
                      if s.lower().startswith("model name")),None)
          raw=Path("out")/(name+"_raw.json")
          fit=json.loads(raw.read_bytes())
          assert fit["status"]=="AUTHOR_SIDE_UNTIMED_COMPLETE_PUBLIC_FIT_NO_PARITY_DECISION"
          assert fit["subject_index_zero_based"]==7 and fit["n_rand_init"]==0
          affinity=sorted(os.sched_getaffinity(0))
          assert affinity==cores
          report={
              "mode":"auto" if name.startswith("auto_") else "Haswell",
              "run_id":os.environ["GITHUB_RUN_ID"],"github_sha":os.environ["GITHUB_SHA"],
              "platform":platform.platform(),"machine":platform.machine(),
              "linux_cpu_model":model,"python":sys.version,"numpy":np.__version__,
              "jax_platforms":os.environ.get("JAX_PLATFORMS"),
              "cpu_set_requested":cores,"affinity":affinity,
              "openblas_threads":int(os.environ["OPENBLAS_NUM_THREADS"]),
              "openblas_coretype":os.environ.get("OPENBLAS_CORETYPE"),
              "raw_sha256":hashlib.sha256(raw.read_bytes()).hexdigest(),
              "pools":[{"internal_api":p.get("internal_api"),
                        "architecture":p.get("architecture"),"version":p.get("version"),
                        "num_threads":p.get("num_threads")} for p in threadpool_info()],
          }
          (Path("out")/(name+"_environment.json")).write_text(json.dumps(report,sort_keys=True,indent=2)+"\n")
          print(json.dumps({"sample":name,"sha256":report["raw_sha256"],
                            "affinity":affinity,"pools":report["pools"]},sort_keys=True))
          PY
          done
          unset OPENBLAS_CORETYPE || true

      - name: Rehash source evidence and compare every old-tolerance and bitwise output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("out")
          names=("auto_1","Haswell_1","Haswell_2","auto_2")
          data={name:json.loads((p/(name+"_environment.json")).read_bytes()) for name in names}
          (p/"environments.json").write_text(json.dumps(data,sort_keys=True,indent=2)+"\n")
          PY
          python work/benchmarks/runtime_v1/compare_subject7_same_host_repeatability.py \
            --original original-64 --outputs out --environment out/environments.json \
            --output "out/derived-abba-${{ github.run_id }}.json"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("out/derived-abba-${{ github.run_id }}.json").read_bytes())
          assert r["status"]=="AUTHOR_SIDE_ABBA_REPEATABILITY_DIAGNOSTIC_ONLY_ORIGINAL_63_OF_64_NONPASS"
          assert r["original_failed_fields"]==["traj.mu","traj.muhat"]
          assert r["original_failed_cells"]=={"traj.mu":4,"traj.muhat":4}
          assert set(r["pairwise"])=={"auto_within_mode","Haswell_within_mode",
              "cross_mode_first","cross_mode_second","cross_mode_interleaved_a","cross_mode_interleaved_b"}
          print("Every 28-field comparison retained; original 63/64 NONPASS unchanged")
          PY

      - name: Archive all four raw fits, host details and derived result even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf01-issue90-abba-${{ github.run_id }}
          path: out/*.json
          if-no-files-found: warn

      - name: Commit only new ABBA derived diagnostic; original failed science unchanged
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/benchmarks/runtime_v1/issue90_results
          cp "out/derived-abba-${{ github.run_id }}.json" \
            "work/benchmarks/runtime_v1/issue90_results/derived-abba-${{ github.run_id }}.json"
          git -C work config user.name 'github-actions[bot]'
          git -C work config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C work add "benchmarks/runtime_v1/issue90_results/derived-abba-${{ github.run_id }}.json"
          git -C work commit -m 'evidence(perf01d): retain bounded same-host ABBA repeatability'
          git -C work fetch origin research/perf-01-preflight-fixtures
          git -C work rebase origin/research/perf-01-preflight-fixtures
          git -C work push origin HEAD:refs/heads/research/perf-01-preflight-fixtures
