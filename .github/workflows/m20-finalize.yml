name: M20 Finalize v1.0 Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - migration/m18-workflow-closure
    paths:
      - '.github/workflows/m20-finalize.yml'
      - 'pyproject.toml'
      - 'CITATION.cff'
      - 'docs/planning/MILESTONES.md'
      - 'docs/planning/M18_COMPLETION_PLAN.md'
      - 'docs/planning/M19_GATE.md'
      - 'docs/planning/M20_GATE.md'
      - 'docs/planning/V1_RELEASE_GATE.md'
      - 'docs/validation/V1_EVIDENCE_INDEX.md'
      - 'reference/validation/v1_release/evidence_index.json'

permissions:
  contents: write

jobs:
  finalize-m20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/m18-workflow-closure

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh frozen M19 manifest for candidate metadata
        run: |
          python scripts/build_v1_evidence_manifest.py --mode finalize
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('reference/validation/v1_release/evidence_manifest.json')
          data = json.loads(p.read_text())
          assert data['status'] == 'FROZEN', data
          assert data['failures'] == [], data['failures']
          assert data['physical_gpu']['pass'] is True, data['physical_gpu']
          print('Refreshed M19 manifest:', data['source_commit'])
          PY

      - name: Final M20 candidate gate
        run: |
          python scripts/check_m20_candidate.py \
            --mode finalize \
            --manifest reference/validation/v1_release/evidence_manifest.json

      - name: Commit candidate-synchronized frozen manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reference/validation/v1_release/evidence_manifest.json
          if git diff --cached --quiet; then
            echo 'Manifest already current.'
          else
            git commit -m 'freeze(m19): refresh manifest for v1.0rc1 candidate'
            git push origin HEAD:migration/m18-workflow-closure
          fi
