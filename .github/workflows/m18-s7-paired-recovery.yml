name: M18 S7 Paired Recovery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/hgfx/diagnostics/recovery.py'
      - 'src/hgfx/optim/compat_quasinewton.py'
      - 'src/hgfx/compat/**'
      - 'scripts/prepare_m18_s7_paired_recovery.py'
      - 'reference/matlab/run_m18_s7_paired_recovery_shard.m'
      - 'tools/check_m18_s7_paired_recovery_shard.py'
      - 'tools/aggregate_m18_s7_paired_recovery.py'
      - 'docs/validation/M18_S7_PAIRED_RECOVERY_PROTOCOL.md'
      - 'reference/validation/m18_s7_paired_recovery/protocol.json'
      - 'tools/prepare_m18_s7_hgf_anomaly_review.py'
      - 'reference/matlab/run_m18_s7_hgf_anomaly_review.m'
      - 'tools/check_m18_s7_hgf_anomaly_review.py'
      - 'docs/validation/M18_S7_HGF_ANOMALY_REVIEW.md'
      - '.github/workflows/m18-s7-hgf-anomaly-review.yml'
      - '.github/workflows/m18-s7-paired-recovery.yml'

jobs:
  shard:
    name: ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {id: hgf-t128-s015, model: hgf_binary, trials: 128, scale: '0.15'}
          - {id: hgf-t128-s035, model: hgf_binary, trials: 128, scale: '0.35'}
          - {id: hgf-t256-s015, model: hgf_binary, trials: 256, scale: '0.15'}
          - {id: hgf-t256-s035, model: hgf_binary, trials: 256, scale: '0.35'}
          - {id: ehgf-t128-s015, model: ehgf_binary, trials: 128, scale: '0.15'}
          - {id: ehgf-t128-s035, model: ehgf_binary, trials: 128, scale: '0.35'}
          - {id: ehgf-t256-s015, model: ehgf_binary, trials: 256, scale: '0.15'}
          - {id: ehgf-t256-s035, model: ehgf_binary, trials: 256, scale: '0.35'}
          - {id: uhgf-t128-s015, model: uhgf_binary, trials: 128, scale: '0.15'}
          - {id: uhgf-t128-s035, model: uhgf_binary, trials: 128, scale: '0.35'}
          - {id: uhgf-t256-s015, model: uhgf_binary, trials: 256, scale: '0.15'}
          - {id: uhgf-t256-s035, model: uhgf_binary, trials: 256, scale: '0.35'}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
      - name: Install HGFX
        run: python -m pip install -e '.[dev]'
      - name: Verify frozen MATLAB reference
        run: python scripts/verify_reference_freeze.py
      - name: Prepare immutable paired shard
        run: |
          mkdir -p reference/generated/m18_s7
          python scripts/prepare_m18_s7_paired_recovery.py \
            --model '${{ matrix.model }}' \
            --trials '${{ matrix.trials }}' \
            --scale '${{ matrix.scale }}' \
            --output 'reference/generated/m18_s7/${{ matrix.id }}-manifest.json'
      - name: Run frozen MATLAB fits
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(fullfile(pwd,'reference','matlab')); run_m18_s7_paired_recovery_shard(fullfile(pwd,'reference','generated','m18_s7','${{ matrix.id }}-manifest.json'), fullfile(pwd,'reference','generated','m18_s7','${{ matrix.id }}-matlab.json'))
      - name: Run paired HGFX fits and comparison
        run: |
          python tools/check_m18_s7_paired_recovery_shard.py \
            'reference/generated/m18_s7/${{ matrix.id }}-manifest.json' \
            'reference/generated/m18_s7/${{ matrix.id }}-matlab.json' \
            --output 'reference/generated/m18_s7/${{ matrix.id }}-comparison.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m18-s7-shard-${{ matrix.id }}
          path: |
            reference/generated/m18_s7/${{ matrix.id }}-manifest.json
            reference/generated/m18_s7/${{ matrix.id }}-matlab.json
            reference/generated/m18_s7/${{ matrix.id }}-comparison.json
          if-no-files-found: warn

  aggregate:
    name: aggregate-paired-recovery
    needs: shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: m18-s7-shard-*
          path: reference/generated/m18_s7/all
          merge-multiple: true
      - name: Aggregate frozen paired recovery evidence
        run: |
          python tools/aggregate_m18_s7_paired_recovery.py \
            reference/generated/m18_s7/all \
            --output reference/generated/m18_s7/aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m18-s7-paired-recovery-aggregate
          path: reference/generated/m18_s7/aggregate.json
          if-no-files-found: warn

  hgf-anomaly-review:
    name: hgf-anomaly-review
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
      - name: Install HGFX
        run: python -m pip install -e '.[dev]'
      - name: Verify frozen MATLAB reference
        run: python scripts/verify_reference_freeze.py
      - name: Regenerate and verify frozen S7 source shards
        run: |
          mkdir -p reference/generated/m18_s7_hgf_review
          python scripts/prepare_m18_s7_paired_recovery.py --model hgf_binary --trials 128 --scale 0.15 --output reference/generated/m18_s7_hgf_review/hgf-t128-s015-manifest.json
          python scripts/prepare_m18_s7_paired_recovery.py --model hgf_binary --trials 256 --scale 0.35 --output reference/generated/m18_s7_hgf_review/hgf-t256-s035-manifest.json
      - name: Prepare exact anomaly review input and HGFX baselines
        run: |
          python tools/prepare_m18_s7_hgf_anomaly_review.py \
            reference/generated/m18_s7_hgf_review/hgf-t128-s015-manifest.json \
            reference/generated/m18_s7_hgf_review/hgf-t256-s035-manifest.json \
            --output reference/generated/m18_s7_hgf_review/input.json
      - name: Run frozen MATLAB objective and self-sensitivity review
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(fullfile(pwd,'reference','matlab')); run_m18_s7_hgf_anomaly_review(fullfile(pwd,'reference','generated','m18_s7_hgf_review','input.json'), fullfile(pwd,'reference','generated','m18_s7_hgf_review','matlab.json'))
      - name: Classify exact-case evidence
        run: |
          python tools/check_m18_s7_hgf_anomaly_review.py \
            reference/generated/m18_s7_hgf_review/input.json \
            reference/generated/m18_s7_hgf_review/matlab.json \
            --output reference/generated/m18_s7_hgf_review/comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m18-s7-hgf-anomaly-review
          path: reference/generated/m18_s7_hgf_review/*.json
          if-no-files-found: warn
