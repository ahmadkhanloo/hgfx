name: M7 Observation Parity
on:
  push:
    branches:
      - main
      - migration/M7-observation-parity
  pull_request:
  workflow_dispatch:
jobs:
  python-observation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/unit/test_observations.py -q
  matlab-python-observation-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: matlab-actions/setup-matlab@v2
      - run: python -m pip install -e .
      - name: Verify frozen HGF reference
        run: python scripts/verify_reference_freeze.py
      - name: Export observation oracle from MATLAB
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(fullfile(pwd,'reference','matlab')); export_m7_observation_parity(fullfile(pwd,'reference','generated','m7_observation_parity.json'))
      - name: Compare MATLAB and Python observations
        run: python tools/check_m7_parity.py reference/generated/m7_observation_parity.json
