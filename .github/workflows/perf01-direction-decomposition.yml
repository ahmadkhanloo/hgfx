name: PERF-01D exact-source BFGS direction decomposition (no fits or timers)

on:
  workflow_dispatch:
  push:
    branches:
      - research/perf-01-preflight-fixtures
    paths:
      - '.github/workflows/perf01-direction-decomposition.yml'
      - 'benchmarks/runtime_v1/derive_subject7_direction_decomposition.py'
      - 'tests/test_perf01_direction_decomposition.py'

permissions:
  contents: write
  actions: read

concurrency:
  group: perf01-direction-decomposition-immutable
  cancel-in-progress: false

jobs:
  verify-and-derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: work
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify immutable algebra and hash-failure tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "numpy==2.3.5"
          python -m unittest discover -s work/tests -p test_perf01_direction_decomposition.py -v
          python -m unittest discover -s work/tests -p test_perf01_bfgs_branch_derived.py -v
          python -m unittest discover -s work/tests -p test_perf01_bfgs_state.py -v
          python -m unittest discover -s work/tests -p test_perf01_subject7_gradient.py -v

      - name: Download both exact archived public fits and same-vector gradients
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bfgs-source paired-source
          gh run download 42187240378 --repo "$GITHUB_REPOSITORY" \
            --name perf01-subject7-bfgs-42187240378 --dir bfgs-source
          gh run download 42120381058 --repo "$GITHUB_REPOSITORY" \
            --name perf01-subject7-gradient-42120381058 --dir paired-source
          test -f bfgs-source/summary.json
          test -f paired-source/summary.json
          test -f bfgs-source/hgfx_raw.json
          test -f bfgs-source/matlab_raw.json
          test -f paired-source/hgfx_raw.json
          test -f paired-source/matlab_raw.json

      - name: Derive only from source SHA256, validate all directional identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0,"work/benchmarks/runtime_v1")
          from compare_subject7_bfgs_state import compare
          root=Path("bfgs-source")
          h=json.loads((root/"hgfx_raw.json").read_bytes())
          m=json.loads((root/"matlab_raw.json").read_bytes())
          old=json.loads((root/"summary.json").read_bytes())
          old={k:v for k,v in old.items() if k not in {"github_run_id","candidate_sha","raw_evidence_sha256","raw_evidence_location"}}
          new=compare(h,m)
          keys=[k for k in set(old)|set(new) if old.get(k)!=new.get(k)]
          print("Exact-replay mismatch keys:",keys)
          for k in keys:
              if isinstance(new.get(k),list) and isinstance(old.get(k),list):
                  mismatched=[i for i,(a,b) in enumerate(zip(new[k],old[k])) if a!=b]
                  print("List",k,"lengths",len(new[k]),len(old[k]),"different slots",mismatched[:10])
                  for idx in mismatched[:2]:
                      print("DIFF NEW",repr(new[k][idx])[:3000])
                      print("DIFF OLD",repr(old[k][idx])[:3000])
              else:
                  print("DIFF",k,repr(new.get(k))[:1000],repr(old.get(k))[:1000])
          PY
          python work/benchmarks/runtime_v1/derive_subject7_direction_decomposition.py \
            --bfgs bfgs-source --paired paired-source \
            --output work/benchmarks/runtime_v1/subject7_bfgs_results/derived-direction-42187240378-42120381058.json
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("work/benchmarks/runtime_v1/subject7_bfgs_results/derived-direction-42187240378-42120381058.json")
          report=json.loads(path.read_bytes())
          assert report["original_bfgs_run"]=="42187240378"
          assert report["original_matched_gradient_run"]=="42120381058"
          assert report["status"]=="AUTHOR_SIDE_NOT_CAUSAL_NOT_SCIENTIFIC_PASS_NOT_TIMED"
          assert len(report["direction_records"])==24
          assert len(report["same_vector_anchors"])==15
          assert report["excluded_terminal_transition_indices"]==[22,23]
          print(json.dumps({
            "code_checked":"original source SHAs; 63/64 failure preserved",
            "record10":report["direction_records"][10],
            "eigen9":report["matrix_eigenspectra"][0],
            "eigen10":report["matrix_eigenspectra"][1],
            "status":report["status"],
          },sort_keys=True))
          PY

      - name: Archive raw-data-derived output even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf01-direction-algebraic-derived-${{ github.run_id }}
          path: work/benchmarks/runtime_v1/subject7_bfgs_results/derived-direction-42187240378-42120381058.json
          if-no-files-found: warn

      - name: Commit separate immutable-derived report on branch
        shell: bash
        run: |
          set -euo pipefail
          git -C work config user.name 'github-actions[bot]'
          git -C work config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          report=benchmarks/runtime_v1/subject7_bfgs_results/derived-direction-42187240378-42120381058.json
          git -C work add "$report"
          if git -C work diff --cached --quiet; then
            echo 'Derived report already committed'
          else
            git -C work commit -m 'evidence(perf01d): retain SHA-verified noncausal BFGS direction decomposition'
            git -C work fetch origin research/perf-01-preflight-fixtures
            git -C work rebase origin/research/perf-01-preflight-fixtures
            git -C work push origin HEAD:refs/heads/research/perf-01-preflight-fixtures
          fi
