name: M18 S8 HGF R0 Ridders Stencil

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/hgfx/models/hgf_binary.py'
      - 'src/hgfx/updates/**'
      - 'src/hgfx/responses/unitsq_sigmoid.py'
      - 'src/hgfx/compat/objective.py'
      - 'src/hgfx/math/**'
      - 'src/hgfx/optim/ridders.py'
      - 'reference/validation/m18_s7_paired_recovery/hgf_anomaly_fixture.json'
      - 'reference/matlab/export_m18_s8_hgf_r0_ridders_stencil.m'
      - 'tools/check_m18_s8_hgf_r0_ridders_stencil.py'
      - 'docs/validation/M18_S8_HGF_R0_RIDDERS_STENCIL.md'
      - '.github/workflows/m18-s8-hgf-r0-ridders-stencil.yml'

jobs:
  hgf-r0-ridders-stencil:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
      - name: Install HGFX
        run: python -m pip install -e '.[dev]'
      - name: Verify frozen MATLAB reference
        run: python scripts/verify_reference_freeze.py
      - name: Export exact MATLAB Ridders stencil
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(fullfile(pwd,'reference','matlab')); export_m18_s8_hgf_r0_ridders_stencil(fullfile(pwd,'reference','generated','m18_s8_hgf_r0_ridders_stencil_matlab.json'))
      - name: Compare exact HGFX stencil evaluations
        run: |
          python tools/check_m18_s8_hgf_r0_ridders_stencil.py \
            reference/validation/m18_s7_paired_recovery/hgf_anomaly_fixture.json \
            reference/generated/m18_s8_hgf_r0_ridders_stencil_matlab.json \
            --output reference/generated/m18_s8_hgf_r0_ridders_stencil_comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m18-s8-hgf-r0-ridders-stencil
          path: reference/generated/m18_s8_hgf_r0_ridders_stencil_*.json
          if-no-files-found: warn
