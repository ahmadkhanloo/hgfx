name: REV-2.4 P6A historical ancestry isolated proof (NOT FULL CI)

# One narrowly scoped read-only history check, run 42815782002, started
# at 983a1bf5a2975f50174d6f54ffd108332c829139. Automatic one-shot
# trigger retired; no unrecorded re-executions or full-suite replays.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-p6a-history:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      JAX_ENABLE_X64: 'true'
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify immutable historical candidate is genuinely present in full Git checkout
        shell: bash
        run: |
          set -euo pipefail
          candidate='897aed804901f9f49ad1d73ecfab6fa714d50098'
          echo "HEAD=$(git rev-parse HEAD)"
          echo "SHALLOW=$(git rev-parse --is-shallow-repository)"
          test "$(git rev-parse --is-shallow-repository)" = false
          git cat-file -e "${candidate}^{commit}"
          git merge-base --is-ancestor "$candidate" HEAD
          echo "Historical P6A candidate=$candidate is a real Git ancestor in full checkout"
      - name: Install identical development test requirements to failed complete suite
        run: python -m pip install -e '.[dev]'
      - name: Verify frozen MATLAB source identity from original repository
        run: python scripts/verify_reference_freeze.py
      - name: Execute ONLY original previously failed P6A historical manifest test
        run: python -m pytest -q tests/paper/test_p6a_manifest.py::test_committed_p6a_manifest_matches_generator
      - name: Record scoped result without full-suite or science claim
        if: success()
        run: echo 'ISOLATED_P6A_HISTORY_TEST=PASS; ORIGINAL_FULL_CI_STILL_NOT_PASS; SCIENCE_STILL_NOT_GLOBAL_PASS'
