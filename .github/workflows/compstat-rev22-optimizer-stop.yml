name: REV-2.2 additive optimizer termination reporting (TARGETED CPU ONLY)

# Source-only/micro-fit regression on original compatible CPU paths;
# no MATLAB oracle, original 614-series data, GPU, or full CI claim.
on:
  push:
    branches: [compstat-revision]
    paths:
      - 'src/hgfx/compat/fit.py'
      - 'tests/unit/test_rev22_optimizer_stop_reporting.py'
      - 'docs/user/API.md'
      - 'CHANGELOG.md'
      - '.github/workflows/compstat-rev22-optimizer-stop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-optimizer-stop-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      JAX_ENABLE_X64: 'true'
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact development source for bounded unit tests
        run: python -m pip install -e '.[dev]'
      - name: Confirm frozen original 334 MATLAB files (no MATLAB execution)
        run: python scripts/verify_reference_freeze.py
      - name: Original compatibility and additive termination tests (NO NEW SCIENCE)
        run: python -m pytest -q tests/unit/test_rev22_optimizer_stop_reporting.py tests/unit/test_m13_api_compatibility.py tests/unit/test_compat_fitting.py
      - name: Scope and historical gate disclaimer
        run: echo "REV-2.2 UNIT CI ONLY; ORIGINAL REV-2.4 SCIENCE NOT_GLOBAL_PASS; FULL CPU CI NOT_PASS; D2 D3 BLOCKED"
