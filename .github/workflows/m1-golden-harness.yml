name: M1 Golden Harness

on:
  push:
    branches:
      - main
      - migration/M1-golden-harness
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/unit tests/golden -q

  matlab-to-python-golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: matlab-actions/setup-matlab@v2
      - run: python -m pip install -e .
      - name: Verify frozen HGF reference
        run: python scripts/verify_reference_freeze.py
      - name: Export reference fixture in MATLAB
        uses: matlab-actions/run-command@v2
        with:
          command: export_fixture(fullfile(pwd,'reference','generated','m1_tapas_logit'))
      - name: Convert MATLAB export to canonical fixture
        run: |
          python tools/import_matlab_fixture.py             reference/generated/m1_tapas_logit             reference/generated/m1_tapas_logit_canonical
      - name: Compute independent Python candidate
        run: |
          python tools/m1_reference_candidate.py             reference/generated/m1_tapas_logit_canonical             reference/generated/m1_tapas_logit_actual.npz
      - name: Numerical diff
        run: |
          python tools/compare_fixture.py             reference/generated/m1_tapas_logit_canonical             reference/generated/m1_tapas_logit_actual.npz             --rtol 1e-11 --atol 1e-12
