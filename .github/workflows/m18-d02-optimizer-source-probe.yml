# Historical oracle/diagnostic replay; routine regression is in regression.yml.
name: M18 D02 Optimizer Source Probe

on:
  workflow_dispatch:

jobs:
  d02-optimizer-source-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
      - run: python -m pip install -e .
      - run: python scripts/verify_reference_freeze.py
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath(fullfile(pwd,'reference','matlab')); export_m18_d02_optimizer_source_probe(fullfile(pwd,'reference','generated','m18_d02_optimizer_source_probe.json'))
      - run: python tools/check_m18_d02_optimizer_source_probe.py reference/generated/m18_d02_optimizer_source_probe.json --output reference/generated/m18_d02_optimizer_source_probe_comparison.json
      - uses: actions/upload-artifact@v4
        with:
          name: m18-d02-optimizer-source-probe
          path: reference/generated/m18_d02_optimizer_source_probe*.json
          if-no-files-found: error
