name: M12 Complete Model Coverage

on:
  push:
    branches:
      - main
      - work/m12-complete-model-coverage
  pull_request:
  workflow_dispatch:

jobs:
  python-complete-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Run complete-model surface and regressions
        run: >
          pytest
          tests/unit/test_complete_model_surface.py
          tests/unit/test_hgf_ar1.py
          tests/unit/test_specialized_models.py
          tests/unit/test_hgf_forward.py
          tests/unit/test_ehgf_forward.py
          tests/unit/test_uhgf_forward.py
          tests/unit/test_observations.py
          -q
