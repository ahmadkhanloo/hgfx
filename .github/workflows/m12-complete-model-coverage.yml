name: M12 Complete Model Coverage

on:
  push:
    branches:
      - main
      - work/m12-complete-model-coverage
  pull_request:
  workflow_dispatch:

jobs:
  closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Verify frozen MATLAB reference
        run: python scripts/verify_reference_freeze.py
      - name: Enforce zero scientific REFERENCE_ONLY
        run: python tools/check_m12_inventory.py
      - name: Full Python regression suite
        run: pytest -q
