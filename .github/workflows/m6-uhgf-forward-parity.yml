name: M6 uHGF Forward Parity

on:
  push:
    branches:
      - main
      - migration/M6-uhgf-forward-parity
  pull_request:
  workflow_dispatch:

jobs:
  python-uhgf-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Run HGF/eHGF/uHGF forward regression tests
        run: pytest tests/unit/test_hgf_forward.py tests/unit/test_ehgf_forward.py tests/unit/test_uhgf_forward.py -q

  matlab-python-uhgf-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: matlab-actions/setup-matlab@v2
      - run: python -m pip install -e .
      - name: Verify frozen HGF reference
        run: python scripts/verify_reference_freeze.py
      - name: Export uHGF forward oracle from MATLAB
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(fullfile(pwd,'reference','matlab')); export_m6_uhgf_forward_parity(fullfile(pwd,'reference','generated','m6_uhgf_forward_parity.json'))
      - name: Compare MATLAB and Python uHGF forward trajectories
        run: python tools/check_m6_parity.py reference/generated/m6_uhgf_forward_parity.json
