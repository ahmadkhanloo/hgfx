name: "PERF-01D Issue90: archived v2 four-source ABBA scientific diagnostic replay (untimed)"

on:
  workflow_dispatch:
  push:
    branches:
      - research/perf-01-preflight-fixtures
    paths:
      - '.github/workflows/perf01-subject7-abba-v2-archived-replay.yml'
      - 'benchmarks/runtime_v1/compare_subject7_same_host_repeatability_v2.py'
      - 'tests/test_perf01_subject7_same_host_repeatability_v2.py'

permissions:
  contents: write
  actions: read

concurrency:
  group: perf01-issue90-original-abba-v2-archive-replay
  cancel-in-progress: false

jobs:
  replay-four-original-v2-processes:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      JAX_PLATFORMS: cpu
      OPENBLAS_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          path: work
      - uses: actions/checkout@v4
        with:
          ref: v1.0.0
          path: frozen-release
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify historical source and strict v2 replay unit tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C frozen-release rev-parse HEAD)" = "4dd8fbd8239d05f2c7932a9a9b3b7795f0a9ab27"
          python -m pip install 'numpy==2.3.5' ./frozen-release
          python -m unittest discover -s work/tests -p test_perf01_subject7_same_host_repeatability_v2.py -v
          python -m unittest discover -s work/tests -p test_perf01_subject7_full_trajectory.py -v
          python -m unittest discover -s work/tests -p test_perf01_fit_cohort.py -v

      - name: Download original full-MATLAB/HGFX reference and EXACT four successful v2 raw fits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original-64 out
          gh run download 41863441006 --repo "$GITHUB_REPOSITORY" \
            --name perf01-64-full-fits-41863441006 --dir original-64
          cp work/benchmarks/runtime_v1/fit_cohort_results/summary-41863441006.json original-64/
          gh run download 42249566219 --repo "$GITHUB_REPOSITORY" \
            --name perf01-issue90-abba-v2-42249566219 --dir out

      - name: Before analysis reject any changed raw bytes, missing case, or different historical host
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          original=Path("original-64")
          s=json.loads((original/"summary-41863441006.json").read_bytes())
          assert s["hgfx_sha"]=="4dd8fbd8239d05f2c7932a9a9b3b7795f0a9ab27"
          assert s["matlab_sha"]=="2437f4dc241541072722a2695ddeca7b44d83dd3"
          assert s["classification_counts"]=={
              "FIT_NUMERICAL_OR_TRAJECTORY_MISMATCH":1,
              "FIT_OUTPUTS_WITHIN_EXISTING_DIAGNOSTIC_TOLERANCES":63}
          assert s["cases"][7]["mismatched_fields"]==["traj.mu","traj.muhat"]
          for name,sha in s["raw_evidence_sha256"].items():
              assert hashlib.sha256((original/name).read_bytes()).hexdigest()==sha,name
          root=Path("out")
          names=("SkylakeX_1","Haswell_1","Haswell_2","SkylakeX_2")
          hashes={
              "SkylakeX_1":"8bef283bd89d31588ffae5e4a9f6944a1873440f2684dec4ffd026a2a62ad3e2",
              "Haswell_1":"10f0577e8843850aecaaa24da1a23fd62dfd9a95e274f90e79ad68e70b362e9a",
              "Haswell_2":"10f0577e8843850aecaaa24da1a23fd62dfd9a95e274f90e79ad68e70b362e9a",
              "SkylakeX_2":"8bef283bd89d31588ffae5e4a9f6944a1873440f2684dec4ffd026a2a62ad3e2",
          }
          environment={}
          for name in names:
              b=(root/(name+"_raw.json")).read_bytes()
              assert hashlib.sha256(b).hexdigest()==hashes[name], name
              record=json.loads(b)
              assert record["blas_mode_requested"]==name.split("_")[0]
              metadata=json.loads((root/(name+"_environment.json")).read_bytes())
              assert metadata["run_id"]=="42249566219"
              assert metadata["github_sha"]=="c84e76ac15779357b620a3d273add224cad2cdf5"
              assert metadata["raw_sha256"]==hashes[name]
              assert metadata["affinity"]==[0,1,2,3]
              assert metadata["mode"]==name.split("_")[0]
              assert any(p["internal_api"]=="openblas"
                         and p["architecture"]==metadata["mode"]
                         and p["version"]=="0.3.30" and p["num_threads"]==4
                         for p in metadata["pools"])
              environment[name]=metadata
          (root/"environments.json").write_text(json.dumps(environment,indent=2,sort_keys=True)+"\n")
          print("PASS archived 4/4 exact SHA256, 4/4 known original source provenance; NO NEW FIT")

      - name: Replay frozen four original fits against all 28 original fitting fields and old tolerances
        shell: bash
        run: |
          set -euo pipefail
          python work/benchmarks/runtime_v1/compare_subject7_same_host_repeatability_v2.py \
            --original original-64 --outputs out --environment out/environments.json \
            --output "out/derived-archived-v2-${{ github.run_id }}.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("out")/f"derived-archived-v2-{os.environ['GITHUB_RUN_ID']}.json"
          r=json.loads(p.read_bytes())
          assert r["status"]=="AUTHOR_SIDE_ABBA_V2_EXPLICIT_CORES_DIAGNOSTIC_ORIGINAL_63_OF_64_NONPASS"
          assert r["original_failed_fields"]==["traj.mu","traj.muhat"]
          assert r["original_failed_cells"]=={"traj.mu":4,"traj.muhat":4}
          assert set(r["pairwise"])=={
              "SkylakeX_within_mode","Haswell_within_mode",
              "cross_mode_first","cross_mode_second",
              "cross_mode_interleaved_a","cross_mode_interleaved_b"}
          for pair in r["pairwise"].values():
              assert pair["original_numeric_tolerances"]["field_count"]==28
              assert pair["strict_serialized_binary64"]["field_count"]==28
          for item in r["vs_original"].values():
              assert item["vs_original_matlab"]["field_count"]==28
              assert item["vs_original_hgfx"]["field_count"]==28
          r["analysis_provenance"]={
              "analysis_run_id":os.environ["GITHUB_RUN_ID"],
              "analysis_sha":os.environ["GITHUB_SHA"],
              "archived_source_run_id":"42249566219",
              "archived_source_sha":"c84e76ac15779357b620a3d273add224cad2cdf5",
              "archived_source_artifact_id":"13519787585",
              "not_new_fitting":True,
              "original_63_64_unchanged":True,
              "original_numeric_tolerances_unchanged":True,
              "historical_failed_analyses_preserved":["42248605099","42249566219","42250002320"]
          }
          p.write_text(json.dumps(r,sort_keys=True,indent=2,allow_nan=False)+"\n")
          print(json.dumps({
              "original":"63/64 NONPASS",
              "within_mode_exact":{name:pair["strict_serialized_binary64"]["all_serialized_binary64_equal"]
                for name,pair in r["pairwise"].items() if "within_mode" in name},
              "between_mode_failing_fields":{
                name:pair["original_numeric_tolerances"]["mismatched_fields"]
                for name,pair in r["pairwise"].items() if "cross_mode" in name},
              "against_archived_matlab":{name:v["vs_original_matlab"]["mismatched_fields"]
                for name,v in r["vs_original"].items()},
              "source_raw_sha256":r["fresh_raw_sha256"]
          },sort_keys=True))
          PY

      - name: Preserve analyzed report and original unaltered archived four-source raw outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf01-issue90-archived-v2-replay-${{ github.run_id }}
          path: out/*.json
          if-no-files-found: warn

      - name: Commit distinct derived archive analysis, never overwrite any historical run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/benchmarks/runtime_v1/issue90_results
          cp "out/derived-archived-v2-${{ github.run_id }}.json" \
            "work/benchmarks/runtime_v1/issue90_results/derived-archived-v2-${{ github.run_id }}.json"
          git -C work config user.name 'github-actions[bot]'
          git -C work config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C work add "benchmarks/runtime_v1/issue90_results/derived-archived-v2-${{ github.run_id }}.json"
          git -C work commit -m 'evidence(perf01d): SHA-replay original four-mode ABBA raw fitting evidence'
          git -C work fetch origin research/perf-01-preflight-fixtures
          git -C work rebase origin/research/perf-01-preflight-fixtures
          git -C work push origin HEAD:refs/heads/research/perf-01-preflight-fixtures
