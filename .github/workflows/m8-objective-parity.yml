name: M8 Objective Parity

on:
  push:
    branches:
      - main
      - migration/M8-objective-parity
  pull_request:
  workflow_dispatch:

jobs:
  python-objective-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Run objective and upstream regression tests
        run: pytest tests/unit/test_objective.py tests/unit/test_observations.py tests/unit/test_hgf_forward.py -q

  matlab-python-objective-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: matlab-actions/setup-matlab@v2
      - run: python -m pip install -e .
      - name: Verify frozen HGF reference
        run: python scripts/verify_reference_freeze.py
      - name: Export fixed-vector objective oracle from MATLAB
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(fullfile(pwd,'reference','matlab')); export_m8_objective_parity(fullfile(pwd,'reference','generated','m8_objective_parity.json'))
      - name: Compare MATLAB and Python objective decomposition
        run: python tools/check_m8_parity.py reference/generated/m8_objective_parity.json
