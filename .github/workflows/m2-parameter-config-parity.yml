name: M2 Parameter Config Parity

on:
  push:
    branches:
      - main
      - migration/M2-parameter-config-parity
  pull_request:
  workflow_dispatch:

jobs:
  python-schema-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/unit tests/golden/test_m2_parameter_config.py -q

  matlab-python-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: matlab-actions/setup-matlab@v2
      - run: python -m pip install -e .
      - name: Verify frozen HGF reference
        run: python scripts/verify_reference_freeze.py
      - name: Export M2 config semantics from MATLAB
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(fullfile(pwd,'reference','matlab')); export_m2_parity(fullfile(pwd,'reference','generated','m2_parity.json'))
      - name: Compare MATLAB and Python config semantics
        run: python tools/check_m2_parity.py reference/generated/m2_parity.json
