name: M18 D02 Basin Diagnostic
on:
  push:
    branches: [main]
    paths:
      - 'docs/validation/M18_D02_BASIN_DIAGNOSTIC.md'
      - 'reference/matlab/export_m18_d02_basin_reference.m'
      - 'reference/matlab/evaluate_m18_d02_basin_points.m'
      - 'tools/prepare_m18_d02_basin_probe.py'
      - 'tools/check_m18_d02_basin_probe.py'
      - 'src/hgfx/**'
      - '.github/workflows/m18-d02-basin-diagnostic.yml'
  pull_request:
    paths:
      - 'docs/validation/M18_D02_BASIN_DIAGNOSTIC.md'
      - 'reference/matlab/export_m18_d02_basin_reference.m'
      - 'reference/matlab/evaluate_m18_d02_basin_points.m'
      - 'tools/prepare_m18_d02_basin_probe.py'
      - 'tools/check_m18_d02_basin_probe.py'
      - 'src/hgfx/**'
      - '.github/workflows/m18-d02-basin-diagnostic.yml'
  workflow_dispatch:

jobs:
  d02-basin-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: matlab-actions/setup-matlab@v2
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/verify_reference_freeze.py
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath(fullfile(pwd,'reference','matlab')); export_m18_d02_basin_reference(fullfile(pwd,'reference','generated','m18_d02_basin_reference.json'))
      - run: python tools/prepare_m18_d02_basin_probe.py reference/generated/m18_d02_basin_reference.json --points reference/generated/m18_d02_basin_points.csv --output reference/generated/m18_d02_basin_hgfx.json
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath(fullfile(pwd,'reference','matlab')); evaluate_m18_d02_basin_points(fullfile(pwd,'reference','generated','m18_d02_basin_points.csv'),fullfile(pwd,'reference','generated','m18_d02_basin_matlab.json'))
      - run: python tools/check_m18_d02_basin_probe.py reference/generated/m18_d02_basin_hgfx.json reference/generated/m18_d02_basin_matlab.json --output reference/generated/m18_d02_basin_comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m18-d02-basin-diagnostic
          path: reference/generated/m18_d02_basin_*
          if-no-files-found: error