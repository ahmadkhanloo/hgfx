name: P7 JNM Preflight

on:
  pull_request:
    paths:
      - 'paper/manuscript.md'
      - 'paper/reproducibility/p6a_paper_evidence_manifest.json'
      - 'paper/highlights.txt'
      - 'paper/references.bib'
      - 'paper/scripts/check_p7_submission.py'
      - 'paper/scripts/build_journal_submission.py'
      - 'tests/paper/test_p7_submission.py'
      - 'docs/research/P7_JNM_PREFLIGHT.md'
      - '.github/workflows/p7-paper-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p7-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install submission dependencies
        run: |
          python -m pip install pytest
          sudo apt-get update
          sudo apt-get install -y pandoc latexmk poppler-utils texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
      - name: Build journal-facing Word/PDF with citeproc
        run: python paper/scripts/build_journal_submission.py
      - name: Run strict JNM candidate preflight
        run: python paper/scripts/check_p7_submission.py --strict
      - name: Verify P7 candidate readiness
        run: pytest -q tests/paper/test_p7_submission.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p7-jnm-submission
          path: paper/dist/journal/
          if-no-files-found: error
