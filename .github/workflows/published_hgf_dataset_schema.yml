name: Published HGF Dataset Schema Inventory

on:
  pull_request:
    paths:
      - 'paper/case_studies/inspect_published_mat_schemas.py'
      - '.github/workflows/published_hgf_dataset_schema.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-structures-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MAT reader only
        run: python -m pip install "numpy==1.26.4" "scipy==1.14.1"
      - name: Inspect source schemas; no subject values exported
        run: python paper/case_studies/inspect_published_mat_schemas.py published_study_schema.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-study-schema-only
          path: published_study_schema.json
          if-no-files-found: error
