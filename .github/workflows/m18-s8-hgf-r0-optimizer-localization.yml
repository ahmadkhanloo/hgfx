name: M18 S8 HGF R0 Optimizer Localization

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/hgfx/optim/compat_quasinewton.py'
      - 'src/hgfx/optim/ridders.py'
      - 'src/hgfx/diagnostics/recovery.py'
      - 'src/hgfx/compat/**'
      - 'reference/validation/m18_s7_paired_recovery/hgf_anomaly_fixture.json'
      - 'reference/matlab/export_m18_s8_hgf_r0_optimizer_probe.m'
      - 'tools/check_m18_s8_hgf_r0_optimizer_probe.py'
      - 'docs/validation/M18_S8_HGF_R0_OPTIMIZER_LOCALIZATION.md'
      - '.github/workflows/m18-s8-hgf-r0-optimizer-localization.yml'

jobs:
  hgf-r0-optimizer-localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
      - name: Install HGFX
        run: python -m pip install -e '.[dev]'
      - name: Verify frozen MATLAB reference
        run: python scripts/verify_reference_freeze.py
      - name: Export frozen MATLAB optimizer states
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(fullfile(pwd,'reference','matlab')); export_m18_s8_hgf_r0_optimizer_probe(fullfile(pwd,'reference','generated','m18_s8_hgf_r0_optimizer_probe.json'))
      - name: Localize HGFX path against exact MATLAB states
        run: |
          python tools/check_m18_s8_hgf_r0_optimizer_probe.py \
            reference/validation/m18_s7_paired_recovery/hgf_anomaly_fixture.json \
            reference/generated/m18_s8_hgf_r0_optimizer_probe.json \
            --output reference/generated/m18_s8_hgf_r0_optimizer_comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m18-s8-hgf-r0-optimizer-localization
          path: reference/generated/m18_s8_hgf_r0_optimizer_*.json
          if-no-files-found: warn
