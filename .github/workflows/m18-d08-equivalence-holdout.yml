# Historical oracle/diagnostic replay; routine regression is in regression.yml.
name: M18 D08 Equivalence Holdout
on:
  workflow_dispatch:

jobs:
  d08-equivalence-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: matlab-actions/setup-matlab@v2
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/verify_reference_freeze.py
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath(fullfile(pwd,'reference','matlab')); export_m18_d08_equivalence_holdout(fullfile(pwd,'reference','generated','m18_d08_equivalence_holdout.json'))
      - run: python tools/check_m18_d08_equivalence_holdout.py reference/generated/m18_d08_equivalence_holdout.json --output reference/generated/m18_d08_equivalence_holdout_comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m18-d08-equivalence-holdout
          path: reference/generated/m18_d08_equivalence_holdout*.json
          if-no-files-found: error