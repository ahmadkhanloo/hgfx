name: M18 S9 Backend Robustness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/hgfx/gpu/**'
      - 'src/hgfx/models/hgf_binary.py'
      - 'src/hgfx/models/ehgf_binary.py'
      - 'src/hgfx/models/uhgf_binary.py'
      - 'src/hgfx/compat/**'
      - 'tests/cpu_gpu/test_m18_s9_backend_semantics.py'
      - 'tests/cpu_gpu/test_m14_fast_engine.py'
      - 'tests/cpu_gpu/test_m15_gpu_fitting.py'
      - 'scripts/run_m18_s9_backend_robustness.py'
      - 'docs/validation/M18_S9_ROBUSTNESS_BACKEND_PROTOCOL.md'
      - 'reference/validation/m18_s9_robustness_backend/protocol.json'
      - '.github/workflows/m18-s9-backend-robustness.yml'

jobs:
  cpu-backend-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HGFX
        run: python -m pip install -e '.[dev]'
      - name: S9 semantic boundary regression
        run: pytest tests/cpu_gpu/test_m18_s9_backend_semantics.py -q
      - name: Existing M14/M15 CPU backend regressions
        run: |
          pytest tests/cpu_gpu/test_m14_fast_engine.py tests/cpu_gpu/test_m15_gpu_fitting.py -q
      - name: Frozen S9 CPU matrix
        run: |
          python scripts/run_m18_s9_backend_robustness.py \
            --output benchmarks/results/m18_s9_backend_robustness.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m18-s9-backend-robustness-cpu
          path: benchmarks/results/m18_s9_backend_robustness.json
          if-no-files-found: warn
