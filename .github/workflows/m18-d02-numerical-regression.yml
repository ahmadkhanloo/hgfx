# Historical oracle/diagnostic replay; routine regression is in regression.yml.
name: M18 D02 Numerical Regression
on:
  workflow_dispatch:

jobs:
  d02-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/unit/test_m18_d02_fdlibm_regression.py -q
