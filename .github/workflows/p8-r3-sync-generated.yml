name: P8 R3 Generated Artifact Sync

on:
  pull_request:
    paths:
      - '.github/workflows/p8-r3-sync-generated.yml'

permissions:
  contents: write

jobs:
  sync-generated:
    if: github.head_ref == 'p8-r3-remediation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic paper dependencies
        run: python -m pip install 'numpy==2.3.3' 'matplotlib==3.10.9' 'pytest>=8'
      - name: Configure bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Regenerate and commit P2/P5 outputs
        run: |
          python paper/scripts/generate_p2_tables.py
          python paper/scripts/generate_p5_figures.py
          git add paper/tables/ paper/figures/
          if ! git diff --cached --quiet; then
            git commit -m "paper: sync generated P2 and P5 artifacts"
          fi
      - name: Regenerate and commit P6A claim audit
        run: |
          python paper/scripts/generate_p6a_claim_audit.py
          git add paper/reproducibility/p6a_claim_audit.json
          if ! git diff --cached --quiet; then
            git commit -m "paper: sync P6A claim audit"
          fi
      - name: Regenerate and commit P6A manifest
        run: |
          python paper/scripts/generate_p6a_manifest.py --from-committed-mode
          git add paper/reproducibility/p6a_paper_evidence_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "paper: sync P6A evidence manifest"
          fi
      - name: Push generated artifacts
        run: git push origin "HEAD:${{ github.head_ref }}"
