name: PV1-01 M18C.2 Horizon Analysis

on:
  pull_request:
    paths:
      - 'src/hgfx/diagnostics/horizon.py'
      - 'scripts/prepare_m18c2_horizon_shard.py'
      - 'reference/matlab/run_m18c2_horizon_shard.m'
      - 'tools/check_m18c2_horizon_shard.py'
      - 'tools/aggregate_m18c2_horizon.py'
      - 'tests/unit/test_m18c2_horizon_analysis.py'
      - 'docs/validation/M18C2_TRIAL_HORIZON_PROTOCOL.md'
      - '.github/workflows/pv1-01-m18c2-horizon.yml'
  workflow_dispatch:
    inputs:
      execute_full:
        description: 'Run the full 24-shard MATLAB/HGFX experiment'
        required: true
        default: 'false'
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  protocol-smoke:
    runs-on: ubuntu-24.04
    env:
      JAX_ENABLE_X64: 'true'
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Frozen reference guard
        run: python scripts/verify_reference_freeze.py
      - name: M18C.2 contract tests
        run: python -m pytest tests/unit/test_m18c2_horizon_analysis.py -q
      - name: Shard generator smoke
        run: |
          python scripts/prepare_m18c2_horizon_shard.py \
            --model hgf_binary --trials 128 --scale 0.15 \
            --output /tmp/m18c2-smoke-manifest.json

  shard:
    if: github.event_name == 'workflow_dispatch' && inputs.execute_full
    name: ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {id: hgf-t128-s015, model: hgf_binary, trials: 128, scale: '0.15'}
          - {id: hgf-t128-s035, model: hgf_binary, trials: 128, scale: '0.35'}
          - {id: hgf-t256-s015, model: hgf_binary, trials: 256, scale: '0.15'}
          - {id: hgf-t256-s035, model: hgf_binary, trials: 256, scale: '0.35'}
          - {id: hgf-t512-s015, model: hgf_binary, trials: 512, scale: '0.15'}
          - {id: hgf-t512-s035, model: hgf_binary, trials: 512, scale: '0.35'}
          - {id: hgf-t1024-s015, model: hgf_binary, trials: 1024, scale: '0.15'}
          - {id: hgf-t1024-s035, model: hgf_binary, trials: 1024, scale: '0.35'}
          - {id: ehgf-t128-s015, model: ehgf_binary, trials: 128, scale: '0.15'}
          - {id: ehgf-t128-s035, model: ehgf_binary, trials: 128, scale: '0.35'}
          - {id: ehgf-t256-s015, model: ehgf_binary, trials: 256, scale: '0.15'}
          - {id: ehgf-t256-s035, model: ehgf_binary, trials: 256, scale: '0.35'}
          - {id: ehgf-t512-s015, model: ehgf_binary, trials: 512, scale: '0.15'}
          - {id: ehgf-t512-s035, model: ehgf_binary, trials: 512, scale: '0.35'}
          - {id: ehgf-t1024-s015, model: ehgf_binary, trials: 1024, scale: '0.15'}
          - {id: ehgf-t1024-s035, model: ehgf_binary, trials: 1024, scale: '0.35'}
          - {id: uhgf-t128-s015, model: uhgf_binary, trials: 128, scale: '0.15'}
          - {id: uhgf-t128-s035, model: uhgf_binary, trials: 128, scale: '0.35'}
          - {id: uhgf-t256-s015, model: uhgf_binary, trials: 256, scale: '0.15'}
          - {id: uhgf-t256-s035, model: uhgf_binary, trials: 256, scale: '0.35'}
          - {id: uhgf-t512-s015, model: uhgf_binary, trials: 512, scale: '0.15'}
          - {id: uhgf-t512-s035, model: uhgf_binary, trials: 512, scale: '0.35'}
          - {id: uhgf-t1024-s015, model: uhgf_binary, trials: 1024, scale: '0.15'}
          - {id: uhgf-t1024-s035, model: uhgf_binary, trials: 1024, scale: '0.35'}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
      - name: Install HGFX
        run: python -m pip install -e '.[dev]'
      - name: Verify frozen MATLAB reference
        run: python scripts/verify_reference_freeze.py
      - name: Prepare immutable paired shard
        run: |
          mkdir -p reference/generated/m18c2
          python scripts/prepare_m18c2_horizon_shard.py \
            --model '${{ matrix.model }}' \
            --trials '${{ matrix.trials }}' \
            --scale '${{ matrix.scale }}' \
            --output 'reference/generated/m18c2/${{ matrix.id }}-manifest.json'
      - name: Run frozen MATLAB fits
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(fullfile(pwd,'reference','matlab')); run_m18c2_horizon_shard(fullfile(pwd,'reference','generated','m18c2','${{ matrix.id }}-manifest.json'), fullfile(pwd,'reference','generated','m18c2','${{ matrix.id }}-matlab.json'))
      - name: Run paired HGFX fits and comparison
        run: |
          python tools/check_m18c2_horizon_shard.py \
            'reference/generated/m18c2/${{ matrix.id }}-manifest.json' \
            'reference/generated/m18c2/${{ matrix.id }}-matlab.json' \
            --output 'reference/generated/m18c2/${{ matrix.id }}-comparison.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m18c2-shard-${{ matrix.id }}
          path: |
            reference/generated/m18c2/${{ matrix.id }}-manifest.json
            reference/generated/m18c2/${{ matrix.id }}-matlab.json
            reference/generated/m18c2/${{ matrix.id }}-comparison.json
          if-no-files-found: warn

  aggregate:
    name: aggregate-horizon
    needs: shard
    if: github.event_name == 'workflow_dispatch' && inputs.execute_full && always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: m18c2-shard-*
          path: reference/generated/m18c2/all
          merge-multiple: true
      - name: Aggregate paired horizon evidence
        run: |
          set +e
          python tools/aggregate_m18c2_horizon.py \
            reference/generated/m18c2/all \
            --output reference/generated/m18c2/aggregate.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            exit "$rc"
          fi
          test -s reference/generated/m18c2/aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m18c2-horizon-aggregate
          path: reference/generated/m18c2/aggregate.json
          if-no-files-found: warn
