name: PV1-01 M18C.2 Horizon Analysis

on:
  pull_request:
    paths:
      - 'src/hgfx/diagnostics/horizon.py'
      - 'scripts/prepare_m18c2_horizon_shard.py'
      - 'reference/matlab/run_m18c2_horizon_shard.m'
      - 'tools/check_m18c2_horizon_shard.py'
      - 'tools/aggregate_m18c2_horizon.py'
      - 'tests/unit/test_m18c2_horizon_analysis.py'
      - 'docs/validation/M18C2_TRIAL_HORIZON_PROTOCOL.md'
      - '.github/workflows/pv1-01-m18c2-horizon.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-smoke:
    runs-on: ubuntu-24.04
    env:
      JAX_ENABLE_X64: 'true'
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Frozen reference guard
        run: python scripts/verify_reference_freeze.py
      - name: M18C.2 contract tests
        run: python -m pytest tests/unit/test_m18c2_horizon_analysis.py -q
