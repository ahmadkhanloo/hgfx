name: P8 R3 Temporary P6A Sync

on:
  pull_request:
    paths:
      - '.github/workflows/p8-r3-temp-p6a-sync.yml'

permissions:
  contents: write

jobs:
  sync-p6a:
    if: github.head_ref == 'p8-r3-remediation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'numpy==2.3.3' 'matplotlib==3.10.9' 'pytest>=8'
      - name: Regenerate P6A outputs
        run: |
          python paper/scripts/generate_p6a_claim_audit.py
          python paper/scripts/generate_p6a_manifest.py --from-committed-mode
      - name: Commit regenerated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/reproducibility/p6a_claim_audit.json paper/reproducibility/p6a_paper_evidence_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "paper: sync P6A audit and manifest"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
