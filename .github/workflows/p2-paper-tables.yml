name: P2 Paper Tables

on:
  pull_request:
    paths:
      - 'paper/scripts/generate_p2_tables.py'
      - 'paper/tables/**'
      - 'tests/paper/**'
      - 'reference/validation/v1_release/**'
      - 'reference/validation/m18_d02_reference_limitation/decision.json'
      - 'reference/validation/m18_d08_reference_limitation/decision.json'
      - 'reference/validation/m18_s7_reference_limitation/decision.json'
      - 'pyproject.toml'
      - '.github/workflows/p2-paper-tables.yml'
  push:
    branches: [main]
    paths:
      - 'paper/scripts/generate_p2_tables.py'
      - 'paper/tables/**'
      - 'tests/paper/**'
      - 'reference/validation/v1_release/**'
      - 'reference/validation/m18_d02_reference_limitation/decision.json'
      - 'reference/validation/m18_d08_reference_limitation/decision.json'
      - 'reference/validation/m18_s7_reference_limitation/decision.json'
      - 'pyproject.toml'
      - '.github/workflows/p2-paper-tables.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p2-paper-tables:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install 'pytest>=8'
      - name: Generate P2 tables and provenance manifest
        run: python paper/scripts/generate_p2_tables.py
      - name: Verify committed tables are reproducible
        run: git diff --exit-code -- paper/tables/*.md
      - name: Run P2 acceptance tests
        run: pytest -q tests/paper/test_p2_tables.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-tables-manifest
          path: paper/tables/p2_tables_manifest.json
          if-no-files-found: error
