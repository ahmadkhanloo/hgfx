name: M3 Scalar Numerical Parity

on:
  push:
    branches:
      - main
      - migration/M3-scalar-numerical-parity
  pull_request:
  workflow_dispatch:

jobs:
  python-scalar-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/unit/test_scalar_math.py -q

  matlab-python-scalar-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: matlab-actions/setup-matlab@v2
      - run: python -m pip install -e .
      - name: Verify frozen HGF reference
        run: python scripts/verify_reference_freeze.py
      - name: Export scalar utility oracle from MATLAB
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(fullfile(pwd,'reference','matlab')); export_m3_scalar_parity(fullfile(pwd,'reference','generated','m3_scalar_parity.json'))
      - name: Compare MATLAB and Python scalar utilities
        run: python tools/check_m3_parity.py reference/generated/m3_scalar_parity.json
