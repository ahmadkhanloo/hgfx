name: M12A Continuous AR1

on:
  push:
    branches:
      - main
      - work/m12-complete-model-coverage
  pull_request:
  workflow_dispatch:

jobs:
  python-ar1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/unit/test_hgf_ar1.py tests/unit/test_hgf_forward.py tests/unit/test_specialized_models.py -q

  matlab-ar1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: matlab-actions/setup-matlab@v2
      - run: python -m pip install -e .
      - run: python scripts/verify_reference_freeze.py
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath(fullfile(pwd,'reference','matlab')); export_m12a_ar1_parity(fullfile(pwd,'reference','generated','m12a_ar1.json'))
      - run: python tools/check_m12a_parity.py reference/generated/m12a_ar1.json
