name: External Published-Study Source Feasibility

on:
  pull_request:
    paths:
      - 'paper/case_studies/probe_external_sources.py'
      - 'paper/case_studies/EXTERNAL_REPLICATION_PROTOCOL_2026-11-04.md'
      - '.github/workflows/external_published_study_feasibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-metadata-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe public OSF/GitHub metadata without downloading behavioral datasets
        run: python paper/case_studies/probe_external_sources.py external_source_probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-source-metadata-probe
          path: external_source_probe.json
          if-no-files-found: error
