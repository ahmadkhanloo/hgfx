name: P6A Paper Evidence Draft

on:
  pull_request:
    paths:
      - 'paper/manuscript.md'
      - 'paper/references.bib'
      - 'paper/reproducibility/**'
      - 'paper/tables/**'
      - 'paper/figures/**'
      - 'paper/scripts/generate_p2_tables.py'
      - 'paper/scripts/generate_p5_figures.py'
      - 'paper/scripts/generate_p6a_manifest.py'
      - 'reference/validation/**'
      - 'tests/paper/test_p6a_manifest.py'
      - '.github/workflows/p6a-paper-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  p6a-draft:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic paper dependencies
        run: python -m pip install 'numpy==2.3.3' 'matplotlib==3.10.9' pytest
      - name: Regenerate P2 tables
        run: python paper/scripts/generate_p2_tables.py
      - name: Regenerate P5 figures and missing vector output
        run: python paper/scripts/generate_p5_figures.py
      - name: Generate P6A draft manifest
        run: python paper/scripts/generate_p6a_manifest.py
      - name: Run P6A integrity tests
        run: pytest -q tests/paper/test_p6a_manifest.py tests/paper/test_p3_evidence.py
      - name: Verify P2/P5 committed text and PNG outputs
        run: |
          git diff --exit-code -- paper/tables/
          git diff --exit-code -- paper/figures/p5_figures_manifest.json paper/figures/*.png
      - name: Commit canonical missing PDF and P6A draft manifest
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git add paper/figures/fig_p3_horizon_diagnostics.pdf paper/reproducibility/p6a_paper_evidence_manifest.json
          if git diff --cached --quiet; then
            echo "Canonical P6A draft outputs already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "paper: commit P6A draft evidence manifest"
          git push origin HEAD:"${HEAD_REF}"
