name: HGFX Publication Artifact Integrity

on:
  pull_request:
    paths:
      - 'paper/computational_statistics/**'
      - 'docs/superpowers/plans/2026-11-03-published-case-studies.md'
      - 'docs/submissions/2026-11-03_publication_revision_status.md'
      - 'tests/paper/test_compstat_documentation.py'
      - '.github/workflows/compstat_paper_integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-artifacts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check frozen reference identity
        run: python scripts/verify_reference_freeze.py
      - name: Verify revision package, protected files and claim sources
        run: python paper/computational_statistics/verify_revision.py
      - name: Run documentation integrity regressions
        run: |
          python -m pip install pytest
          python -m pytest -q tests/paper/test_compstat_documentation.py
