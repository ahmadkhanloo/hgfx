name: M18 D08 Source Likelihood Diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/m18-d08-source-likelihood-diagnostic.yml'
      - 'docs/validation/M18_D08_SOURCE_LIKELIHOOD_DIAGNOSTIC.md'
      - 'reference/matlab/export_m18_d08_source_likelihood_probe.m'
      - 'tools/check_m18_d08_source_likelihood_probe.py'
      - 'src/hgfx/responses/gaussian.py'
      - 'src/hgfx/compat/objective.py'

jobs:
  d08-source-likelihood-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
      - name: Install HGFX
        run: python -m pip install -e .
      - name: Verify frozen MATLAB reference
        run: python scripts/verify_reference_freeze.py
      - name: Export frozen D08 source likelihood sample
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(fullfile(pwd,'reference','matlab')); export_m18_d08_source_likelihood_probe(fullfile(pwd,'reference','generated','m18_d08_source_likelihood_probe.json'))
      - name: Localize Gaussian likelihood residual
        run: python tools/check_m18_d08_source_likelihood_probe.py reference/generated/m18_d08_source_likelihood_probe.json --output reference/generated/m18_d08_source_likelihood_probe_comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m18-d08-source-likelihood-diagnostic
          path: |
            reference/generated/m18_d08_source_likelihood_probe.json
            reference/generated/m18_d08_source_likelihood_probe_comparison.json
