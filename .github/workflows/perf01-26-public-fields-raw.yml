name: "PERF-01D raw 26 MATLAB public fields (AUTHOR-SIDE, NOT SCIENCE PASS)"
on:
  push:
    branches:
      - research/perf01-subject7-private-armijo-candidates
    paths:
      - '.github/workflows/perf01-26-public-fields-raw.yml'
      - 'benchmarks/runtime_v1/matlab/subject7_private_candidate_armijo_matlab.m'
      - 'benchmarks/runtime_v1/replay_subject7_matlab_26_public_fields.py'
      - 'tests/test_perf01_subject7_matlab_26_public_fields_raw.py'
      - 'docs/research/PERF01D_26_PUBLIC_FIELDS_RAW_ARCHIVE_PRESPEC_2026-11-07.md'
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  public-26-raw:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      JAX_PLATFORMS: cpu
      OPENBLAS_NUM_THREADS: '4'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: work
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: v1.0.0
          path: frozen-release
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ComputationalPsychiatry/hgf-toolbox
          ref: 2437f4dc241541072722a2695ddeca7b44d83dd3
          path: matlab-reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen sources and ten fail-closed synthetic raw-field tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C frozen-release rev-parse HEAD)" = '4dd8fbd8239d05f2c7932a9a9b3b7795f0a9ab27'
          test "$(git -C matlab-reference rev-parse HEAD)" = '2437f4dc241541072722a2695ddeca7b44d83dd3'
          python -m pip install "numpy==2.3.5" "scipy>=1.14,<2" ./frozen-release
          python -m unittest discover -s work/tests -p 'test_perf01_subject7_matlab_26_public_fields_raw.py' -v
          python work/benchmarks/runtime_v1/generate_inputs.py --output work/benchmarks/runtime_v1 --check
          python work/benchmarks/runtime_v1/export_release_configs.py --output work/benchmarks/runtime_v1 --check
      - name: SHA-check original incident, prior BFGS source and exact archived counterfactual vectors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output candidate original-bfgs
          gh run download 42187240378 --repo "$GITHUB_REPOSITORY" \
            --name perf01-subject7-bfgs-42187240378 --dir original-bfgs
          gh run download 42366705874 --repo "$GITHUB_REPOSITORY" \
            --name perf01d-source-same-state-x6-single-step-42366705874 --dir candidate
          echo '060247be69f8542cf0c7e30d5cf12fb93e12411737452a308e489fef9e220fce  original-bfgs/hgfx_raw.json' | sha256sum -c -
          echo '4816a4bf52c86d383363e6b957376e66e33a825be482de9ff3c75b557590ff2a  original-bfgs/matlab_raw.json' | sha256sum -c -
          echo 'b2f2134a4eb5276fd7734dacedb26c74b4cd410eb984caf945befe9758b42144  candidate/source-same-state-two-gradient-candidates.json' | sha256sum -c -
          python work/benchmarks/runtime_v1/subject7_private_candidate_armijo.py \
            --stage prepare --candidate candidate/source-same-state-two-gradient-candidates.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('work/benchmarks/runtime_v1/fit_cohort_results/summary-41863441006.json').read_bytes())
          assert d["subject_count"] == 64
          assert d["classification_counts"] == {
            "FIT_OUTPUTS_WITHIN_EXISTING_DIAGNOSTIC_TOLERANCES": 63,
            "FIT_NUMERICAL_OR_TRAJECTORY_MISMATCH": 1}
          assert d["cases"][7]["mismatched_fields"] == ["traj.mu","traj.muhat"]
          assert all(d["cases"][7]["fields"][k]["mismatch_count"] == 4
                     for k in ("traj.mu","traj.muhat"))
          print("Original 63/64 scientific NONPASS and subject-7 4+4 confirmed.")
          PY
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Execute original frozen private MATLAB objective plus optional raw 26-field export
        uses: matlab-actions/run-command@v3
        with:
          command: "addpath(fullfile(pwd,'work','benchmarks','runtime_v1','matlab')); subject7_private_candidate_armijo_matlab(fullfile(pwd,'work','benchmarks','runtime_v1'),fullfile(pwd,'matlab-reference'),fullfile(pwd,'candidate','source-same-state-two-gradient-candidates.json'),fullfile(pwd,'output','private-three-source-objectives-new-run.json'),fullfile(pwd,'output','native-instrumented-all-26-fields.mat'))"
      - name: Check real private MATLAB objective and compare all 26 RAW public fields using SciPy
        shell: bash
        run: |
          set -euo pipefail
          python work/benchmarks/runtime_v1/subject7_private_candidate_armijo.py \
            --stage verify --candidate candidate/source-same-state-two-gradient-candidates.json \
            --matlab output/private-three-source-objectives-new-run.json \
            --output output/private-three-source-objectives-derived.json
          python work/benchmarks/runtime_v1/replay_subject7_matlab_26_public_fields.py \
            --mat output/native-instrumented-all-26-fields.mat \
            --private output/private-three-source-objectives-new-run.json \
            --original-fit work/benchmarks/runtime_v1/fit_cohort_results/summary-41863441006.json \
            --output output/independently-parsed-26-field-results.json
      - name: Preserve all raw/derived archive hashes on both success and failure
        shell: bash
        if: always()
        run: |
          mkdir -p output
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path('output')
          hashes={p.name:hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.iterdir() if p.is_file() and p.name!='provenance.json'}
          meta={
            'schema':'perf01d-supplemental-26-public-raw-field-evidence-v1',
            'run_id':os.environ['GITHUB_RUN_ID'],
            'tested_sha':os.environ['GITHUB_SHA'],
            'prespec_sha':'5eb723ea859e160564c10fb181e52de68ece175e',
            'frozen_hgfx':'4dd8fbd8239d05f2c7932a9a9b3b7795f0a9ab27',
            'frozen_matlab':'2437f4dc241541072722a2695ddeca7b44d83dd3',
            'previous_private_matlab_run':'42375431029',
            'previous_archive_replay_run':'42377148619',
            'original_science':'63/64 SCIENTIFIC NONPASS',
            'independent_scientific_review':'NOT_RECEIVED',
            'perf01c':'NOT_FROZEN',
            'performance_timing':'NOT_RUN',
            'sha256':hashes,
          }
          (root/'provenance.json').write_text(json.dumps(meta,sort_keys=True,indent=2)+'\n')
          print(json.dumps(hashes,sort_keys=True))
          PY
      - name: Retain raw MATLAB MAT-v7 and all generated/failed source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf01d-public-26-raw-fields-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
