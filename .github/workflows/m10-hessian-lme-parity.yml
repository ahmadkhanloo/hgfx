name: M10 Hessian LME Parity

on:
  push:
    branches:
      - main
      - migration/M10-hessian-lme-parity
  pull_request:
  workflow_dispatch:

jobs:
  python-fit-statistics-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Run M10 and upstream compatibility regressions
        run: pytest tests/unit/test_fit_statistics.py tests/unit/test_compat_fitting.py tests/unit/test_objective.py tests/unit/test_scalar_math.py -q

  matlab-python-hessian-lme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: matlab-actions/setup-matlab@v2
      - run: python -m pip install -e .
      - name: Verify frozen HGF reference
        run: python scripts/verify_reference_freeze.py
      - name: Export Hessian LME and restart-selection oracle from MATLAB
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(fullfile(pwd,'reference','matlab')); export_m10_hessian_lme(fullfile(pwd,'reference','generated','m10_hessian_lme.json'))
      - name: Compare MATLAB and Python M10 results
        run: python tools/check_m10_parity.py reference/generated/m10_hessian_lme.json
