name: P5 Paper Figures

on:
  pull_request:
    paths:
      - 'paper/scripts/generate_p5_figures.py'
      - 'paper/figures/**'
      - 'paper/reproducibility/p2a10_*.json'
      - 'paper/reproducibility/p3_m18c2_*.json'
      - 'paper/tables/**'
      - 'tests/paper/test_p5_figures.py'
      - 'reference/validation/m18_s7_reference_limitation/decision.json'
      - '.github/workflows/p5-paper-figures.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  p5-paper-figures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install figure dependencies
        run: python -m pip install 'numpy==2.3.3' 'matplotlib==3.10.9' pytest
      - name: Generate P5 figures
        run: python paper/scripts/generate_p5_figures.py
      - name: Run P5 tests
        run: pytest -q tests/paper/test_p5_figures.py
      - name: Commit canonical generated P3 figure outputs
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git add paper/figures/fig_p3_horizon_diagnostics.png paper/figures/p5_figures_manifest.json
          if git diff --cached --quiet; then
            echo "Canonical P3 figure outputs already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "paper: commit generated P3 diagnostic figure"
          git push origin HEAD:"${HEAD_REF}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p5-paper-figures
          path: paper/figures/
          if-no-files-found: error
