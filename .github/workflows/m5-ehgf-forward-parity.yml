name: M5 eHGF Forward Parity

on:
  push:
    branches:
      - main
      - migration/M5-ehgf-forward-parity
  pull_request:
  workflow_dispatch:

jobs:
  python-ehgf-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/unit/test_ehgf_forward.py -q

  matlab-python-ehgf-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: matlab-actions/setup-matlab@v2
      - run: python -m pip install -e .
      - name: Verify frozen HGF reference
        run: python scripts/verify_reference_freeze.py
      - name: Export eHGF forward oracle from MATLAB
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(fullfile(pwd,'reference','matlab')); export_m5_ehgf_forward_parity(fullfile(pwd,'reference','generated','m5_ehgf_forward_parity.json'))
      - name: Compare MATLAB and Python eHGF forward trajectories
        run: python tools/check_m5_parity.py reference/generated/m5_ehgf_forward_parity.json
