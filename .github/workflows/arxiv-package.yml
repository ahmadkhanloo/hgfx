name: arXiv Submission Package

on:
  push:
    branches:
      - main
    paths:
      - 'paper/arxiv/manuscript.md'
      - 'paper/arxiv/build_submission.py'
      - 'paper/arxiv/figures/**'
      - 'paper/SUPPLEMENTARY_APPENDICES.md'
      - 'paper/references.bib'
      - '.github/workflows/arxiv-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
      - name: Build and smoke-test arXiv package
        run: python paper/arxiv/build_submission.py
      - name: Inspect outputs
        run: |
          pdfinfo paper/arxiv/dist/HGFX_arXiv_preprint.pdf | head -20
          unzip -l paper/arxiv/dist/HGFX_arXiv_source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: hgfx-arxiv-submission
          path: |
            paper/arxiv/dist/HGFX_arXiv_preprint.pdf
            paper/arxiv/dist/HGFX_arXiv_source.zip
          if-no-files-found: error
