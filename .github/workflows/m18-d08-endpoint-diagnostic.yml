# Historical oracle/diagnostic replay; routine regression is in regression.yml.
name: M18 D08 Endpoint Diagnostic
on:
  workflow_dispatch:

jobs:
  d08-endpoint-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
      - run: python -m pip install -e .
      - run: python scripts/verify_reference_freeze.py
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath(fullfile(pwd,'reference','matlab')); export_m18_d08_endpoint(fullfile(pwd,'reference','generated','m18_d08_endpoint.json'))
      - run: python tools/check_m18_d08_endpoint.py reference/generated/m18_d08_endpoint.json --output reference/generated/m18_d08_endpoint_comparison.json
      - uses: actions/upload-artifact@v4
        with:
          name: m18-d08-endpoint-diagnostic
          path: reference/generated/m18_d08_endpoint*.json
          if-no-files-found: error
