name: P8 Delta Scope

on:
  pull_request:
    paths:
      - 'paper/manuscript.md'
      - 'paper/reproducibility/p6a_paper_evidence_manifest.json'
      - 'paper/references.bib'
      - 'paper/scripts/generate_p8_delta_manifest.py'
      - 'tests/paper/test_p8_delta_manifest.py'
      - 'docs/research/P8_DELTA_SCOPE.md'
      - 'docs/research/P8_DELTA_MANIFEST.json'
      - '.github/workflows/p8-delta-scope.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p8-delta:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Generate P8 delta manifest
        run: |
          CANDIDATE_SHA=$(python -c "import json; print(json.load(open('docs/research/P8_DELTA_MANIFEST.json'))['candidate']['sha'])")
          python paper/scripts/generate_p8_delta_manifest.py --candidate-sha "$CANDIDATE_SHA"
      - name: Test P8 delta scope
        run: pytest -q tests/paper/test_p8_delta_manifest.py
      - name: Verify committed delta manifest reproduces exactly
        run: git diff --exit-code -- docs/research/P8_DELTA_MANIFEST.json
