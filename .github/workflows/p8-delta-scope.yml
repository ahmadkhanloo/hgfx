name: P8 Delta Scope

on:
  pull_request:
    paths:
      - 'paper/scripts/generate_p8_delta_manifest.py'
      - 'tests/paper/test_p8_delta_manifest.py'
      - 'docs/research/P8_DELTA_SCOPE.md'
      - 'docs/research/P8_DELTA_MANIFEST.json'
      - '.github/workflows/p8-delta-scope.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  p8-delta:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Generate P8 delta manifest
        run: python paper/scripts/generate_p8_delta_manifest.py
      - name: Test P8 delta scope
        run: pytest -q tests/paper/test_p8_delta_manifest.py
      - name: Commit canonical delta manifest
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git add docs/research/P8_DELTA_MANIFEST.json
          if git diff --cached --quiet; then
            echo "P8 delta manifest already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "paper: commit deterministic P8 delta manifest"
          git push origin HEAD:"${HEAD_REF}"
