name: M18 S8 HGF R0 Validity Reduction Inline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/m18-s8-hgf-r0-validity-reduction-inline.yml'
      - 'src/hgfx/validation/trajectory_checks.py'
      - 'src/hgfx/models/hgf_binary.py'
      - 'reference/validation/m18_s7_paired_recovery/hgf_anomaly_fixture.json'
      - 'reference/matlab/export_m18_s8_hgf_r0_ridders_stencil.m'

jobs:
  validity-reduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
      - name: Install HGFX
        run: python -m pip install -e '.[dev]'
      - name: Verify frozen MATLAB reference
        run: python scripts/verify_reference_freeze.py
      - name: Export exact MATLAB Ridders stencil
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(fullfile(pwd,'reference','matlab')); export_m18_s8_hgf_r0_ridders_stencil(fullfile(pwd,'reference','generated','m18_s8_hgf_r0_ridders_stencil_matlab.json'))
      - name: Compare trajectory-validity reduction orders
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          from hgfx.compat.configs import hgf_binary_config, unitsq_sgm_config
          from hgfx.models.hgf_binary import hgf_binary

          FIXTURE = Path('reference/validation/m18_s7_paired_recovery/hgf_anomaly_fixture.json')
          REF = Path('reference/generated/m18_s8_hgf_r0_ridders_stencil_matlab.json')
          OUT = Path('reference/generated/m18_s8_hgf_r0_validity_reduction_inline.json')
          CASE_ID = 'PR-hgf_binary-T256-S0.35-R0'
          CASE_SHA = '1b99d57ab00960941d6d0e2997712bfc5b3319edcd2521fee257a89b7ccec8b5'
          REALMAX = np.finfo(np.float64).max
          JUMP = np.float64(16.0)

          def arr(v):
              if isinstance(v, dict) and v.get('hgfx_numeric') == 'ieee-strings-v1':
                  return np.asarray(v['data'], dtype=np.float64).reshape(v['shape'], order='F')
              return np.asarray(v, dtype=np.float64)
          def scalar(v): return float(arr(v).reshape(-1)[0])
          def left_sum(v):
              s=np.float64(0.0)
              for x in np.asarray(v,dtype=np.float64).reshape(-1): s=np.float64(s+x)
              return s
          def four_sum(v):
              a=np.asarray(v,dtype=np.float64).reshape(-1); lanes=np.zeros(4,dtype=np.float64)
              for i,x in enumerate(a): lanes[i&3]=np.float64(lanes[i&3]+x)
              s=np.float64(0.0)
              for x in lanes: s=np.float64(s+x)
              return s
          def m_numpy(v): return np.float64(np.mean(np.asarray(v,dtype=np.float64)))
          def m_left(v):
              a=np.asarray(v,dtype=np.float64).reshape(-1); return np.float64(left_sum(a)/np.float64(a.size))
          def m_four(v):
              a=np.asarray(v,dtype=np.float64).reshape(-1); return np.float64(four_sum(a)/np.float64(a.size))
          means={'numpy_mean':m_numpy,'scalar_left_mean':m_left,'four_lane_mean':m_four}

          fixture=json.loads(FIXTURE.read_text())
          ref=json.loads(REF.read_text())
          case=[c for c in fixture['cases'] if c['case_id']==CASE_ID][0]
          assert case['case_sha256']==CASE_SHA and ref['case_sha256']==CASE_SHA
          u=np.asarray(case['u'],dtype=np.float64)
          prc=hgf_binary_config().resolve_placeholders(u); obs=unitsq_sgm_config()
          free_idx=np.asarray(case['free_indices_zero_based'],dtype=np.int64)

          def validity(free):
              full=np.concatenate((prc.priormus,obs.priormus)).astype(np.float64); full[free_idx]=free
              try:
                  traj,_=hgf_binary(u,full[:len(prc.parameters)],transformed=True,validate=False)
              except Exception:
                  return {k:True for k in means}, {'reason':'forward_failure'}
              mu=np.asarray(traj['mu'],dtype=np.float64)[:,1:]
              with np.errstate(divide='ignore',invalid='ignore'): pi=(np.float64(1.0)/np.asarray(traj['sa'],dtype=np.float64))[:,1:]
              if np.any(np.isnan(mu)) or np.any(np.isnan(pi)):
                  return {k:True for k in means}, {'reason':'nan'}
              dmu=np.diff(mu,axis=0); dpi=np.diff(pi,axis=0); out={}; details={}
              for name,fn in means.items():
                  rms_mu=np.array([np.sqrt(fn(dmu[:,j]**2)) for j in range(dmu.shape[1])],dtype=np.float64)
                  rms_pi=np.array([np.sqrt(fn(dpi[:,j]**2)) for j in range(dpi.shape[1])],dtype=np.float64)
                  bad=bool(np.any(np.abs(dmu)>JUMP*rms_mu) or np.any(np.abs(dpi)>JUMP*rms_pi))
                  out[name]=bad; details[name]={'rms_mu':rms_mu.tolist(),'rms_pi':rms_pi.tolist()}
              return out, details

          counts={k:0 for k in means}; rows=[]; invalid_n=0; n=0
          for sample in ref['samples']:
              step=int(round(scalar(sample['step_1based']))); h=scalar(sample['h'])
              for side in ('plus','minus'):
                  expected=sample[side]; free=arr(expected['free']).reshape(-1)
                  oracle=(scalar(expected['neg_joint'])==REALMAX) or (not np.isfinite(scalar(expected['neg_joint'])))
                  pred,details=validity(free); invalid_n+=int(oracle); n+=1
                  mm={k:bool(v!=oracle) for k,v in pred.items()}
                  for k,v in mm.items(): counts[k]+=int(v)
                  if any(mm.values()) or len(set(pred.values()))>1:
                      rows.append({'step_1based':step,'side':side,'h':h,'matlab_invalid':oracle,'predictions':pred,'mismatches':mm,'details':details})
          zero=[k for k,v in counts.items() if v==0]
          if zero==['four_lane_mean']: cls='FOUR_LANE_REDUCTION_MATCHES_MATLAB_VALIDITY_ORACLE'
          elif len(zero)==1: cls=zero[0].upper()+'_MATCHES_MATLAB_VALIDITY_ORACLE'
          elif len(zero)>1: cls='MULTIPLE_REDUCTIONS_MATCH_MATLAB_VALIDITY_ORACLE'
          else: cls='NO_REDUCTION_CANDIDATE_MATCHES_MATLAB_VALIDITY_ORACLE'
          payload={'protocol':'m18-s8-hgf-r0-validity-reduction-inline-1','reference_commit':'2437f4dc241541072722a2695ddeca7b44d83dd3','case_id':CASE_ID,'case_sha256':CASE_SHA,'classification':cls,'acceptance_effect':'NONE_DIAGNOSTIC_ONLY','evaluated_points':n,'matlab_invalid_points':invalid_n,'candidate_mismatch_counts':counts,'zero_mismatch_candidates':zero,'disagreements':rows,'note':'Exact frozen Ridders stencil; no threshold/data/start/model/optimizer/gate changed.'}
          OUT.parent.mkdir(parents=True,exist_ok=True); OUT.write_text(json.dumps(payload,indent=2,allow_nan=True)+'\n')
          print(json.dumps({k:payload[k] for k in ['classification','evaluated_points','matlab_invalid_points','candidate_mismatch_counts','zero_mismatch_candidates']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m18-s8-hgf-r0-validity-reduction-inline
          path: reference/generated/m18_s8_hgf_r0_validity_reduction_inline.json
          if-no-files-found: warn
