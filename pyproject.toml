[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hgfx"
version = "0.0.0"
description = "GPU-native Python/JAX toolbox for Hierarchical Gaussian Filters"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "HGFX contributors"}]
dependencies = [
  "numpy>=2.0",
  "jax>=0.4.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
